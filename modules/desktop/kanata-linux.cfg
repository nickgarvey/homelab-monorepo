;; Kanata configuration for QWERTY with Homerow Mods
;;
;; Tapping a homerow key sends the character.
;; Holding a homerow key sends the modifier.
;;
;; :: MODIFIER MAPPING ::
;; Hold [A] or [;] => Option (Alt)
;; Hold [S] or [L] => Control
;; Hold [D] or [K] => Command (Super/Win)
;; Hold [F] or [J] => Shift
;; Hold [R] or [U] => Hyper (Ctrl+Alt+Shift+Super)
;; Hold [V] or [M] => Meh   (Ctrl+Alt+Shift)
;;
;; A home-row key becomes its modifier once a key on the other hand (per
;; defhands) is pressed and released while it is held, so f then a quick n
;; gives N, while a roll that lets go of f first (f n f-up n-up) types "fn".
;; Same-hand keys do not decide, so same-hand mods stack (d+f = Super+Shift).
;; Held alone for 200ms it also becomes the modifier. A home-row key pressed
;; within 100ms of the previous key (mid-word typing) is always a letter.

(defcfg
  ;; process-unmapped-keys must be set for the OS being used.
  ;; Comment out or remove the lines for other operating systems.

  ;; For macOS
  ;; process-unmapped-keys yes
  ;; concurrent-tap-hold yes

  ;; For Linux
  process-unmapped-keys yes
  concurrent-tap-hold yes
  tap-hold-require-prior-idle 100
  ;; manage-leds no

  ;; For Windows
  ;; process-unmapped-keys yes
)

;; Which hand each key belongs to, for tap-hold-opposite-hand-release.
(defhands
  (left  grv 1 2 3 4 5 tab q w e r t caps a s d f g lsft z x c v b)
  (right 6 7 8 9 0 - = bspc y u i o p [ ] \ h j k l ; ' ret n m , . / rsft))

;; Home-row mod: hold on an opposite-hand press+release or after 200ms;
;; a re-press within 100ms of a tap taps again (tap then hold to repeat).
(deftemplate hrm (key mod)
  (tap-hold-opposite-hand-release 200 $key $mod
    (timeout hold) (same-hand ignore) (tap-repress-timeout 100))
)

;; Define aliases for the homerow mod keys to make the layer definition cleaner.

(defalias
  ;; Left Hand
  a-opt (t! hrm a lalt)
  s-ctl (t! hrm s lctl)
  d-cmd (t! hrm d lmet)
  f-sft (t! hrm f lsft)

  ;; Right Hand
  j-sft (t! hrm j rsft)
  k-cmd (t! hrm k rmet)
  l-ctl (t! hrm l rctl)
  sc-opt (t! hrm scln lalt)

  ;; Hyper (all four) and Meh (no Super) on the upper/lower rows.
  r-hyp (t! hrm r (multi lctl lalt lsft lmet))
  u-hyp (t! hrm u (multi rctl ralt rsft rmet))
  v-meh (t! hrm v (multi lctl lalt lsft))
  m-meh (t! hrm m (multi rctl ralt rsft))

  switch-no-mod (layer-switch qwerty-nohomerow)
  switch-mod (layer-switch qwerty-homerow)
)

;; Define chords (key combinations)
(defchordsv2
  (w e r) esc 50 all-released ()
  (m ,) - 50 all-released ()
  (, .) ` 50 all-released ()
  (u j) = 50 all-released ()
)

(defsrc
  esc    f1    f2    f3    f4    f5    f6    f7    f8    f9    f10   f11   f12  prnt slck pause
  grv    1     2     3     4     5     6     7     8     9     0     -     =     bspc ins home pgup del end pgdn
  tab    q     w     e     r     t     y     u     i     o     p     [     ]     \
  caps   a     s     d     f     g     h     j     k     l     ;     '    ret
  lsft   z     x     c     v     b     n     m     ,     .     /     rsft
  lctl  lmet lalt  spc               ralt rmet  rctl  ◀    ▲ ▼    ▶
)

;; Define the active layer with homerow mods.
;; Unchanged keys are represented by '_' which inherits from defsrc.
(deflayer qwerty-homerow
  _     _      _      _      _      _      _      _      _      _      _      _      _      _      _      _
  _     _      _      _      _      _      _      _      _      _      _      _      _      _      _      _      _      _      _      _
  _     _      _      _      @r-hyp _      _      @u-hyp _      _      _      _      _      _
  bspc  @a-opt @s-ctl @d-cmd @f-sft _      _      @j-sft @k-cmd @l-ctl @sc-opt _      _
  _     _      _      _      @v-meh _      _      @m-meh _      _      _      _
  _     _      _      _                   _               _      @switch-no-mod          _ _ _ _
)

(deflayer qwerty-nohomerow
  _     _      _      _      _      _      _      _      _      _      _      _      _      _      _      _
  _     _      _      _      _      _      _      _      _      _      _      _      _      _      _      _      _      _      _      _
  _     _      _      _      _      _      _      _      _      _      _      _      _      _
  _     _      _      _      _      _      _      _      _      _      _      _      _
  _     _      _      _      _      _      _      _      _      _      _      _
  _     _      _      _                   _               _      @switch-mod          _ _ _ _
)
