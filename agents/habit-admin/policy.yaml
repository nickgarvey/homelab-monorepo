# Sandbox policy for the habit-admin agent, passed at sandbox creation
# (--policy); it is not in the image. It grants no network access itself: the
# sandbox reaches only what its providers add, litellm (for pi's node) and the
# bridge's admin API (for the habit-admin CLI).
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /nix/store # everything in the image is a store path; /bin and /usr/bin link into it
    - /bin
    - /usr
    - /etc
    - /proc/self
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort
