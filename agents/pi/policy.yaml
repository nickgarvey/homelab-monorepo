# Sandbox policy for the pi agent, passed at sandbox creation (--policy); it is
# not in the image. It grants no network access itself: the only
# endpoint the sandbox can reach is the one the attached litellm provider
# adds (litellm-profile.yaml).
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /nix/store # everything in the image is a store path; /bin and /usr/bin link into it
    - /bin
    - /usr
    - /etc
    - /proc/self
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort
