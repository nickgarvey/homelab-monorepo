keys:
  - &ngarvey age1nyxjtps38j4p52nmwtf96h7d9mege90ftf4xcpxppctcwq5huqys4hy5k0
  - &workstation age1le67uqtvry52ch733vytmr7yjvjsna8u3k6a9n285ggmuzfv9q7s4rqufu
  - &wabbajack age1phmmhj7kfedel0uz052sj8glcevj6qgh5sdmq73ctm8qqlnxaarq4l9rvv
  - &dovahkiin age1m9l2ncrkg5zelkegwpa2ux2kw5cljay2m9sxuzf2eyz8qqje45vsmfn76k
  - &dragonsreach age1c3fwgyf6tm44gzhyvfjk5eyysef0shufd50kdg4t0w2rd9jylcusakgxpy
  - &lydia age1cz96x8w6653wruqxrwquczv3ulwe5gfnvyy6p3tzvs8mehc7gyas7hty0k
  # fus/ro/dah/joor/zah/frul: derived with ssh-to-age from each host's
  # /etc/ssh/ssh_host_ed25519_key.pub. sops-nix reads that key by default
  # (sops.age.sshKeyPaths), so nothing is placed on the machine by hand.
  - &fus age1vw4e5v6qlm3gac9v3l33qkakprfnwn5mr4vq2pa5z4s7h2llvpsspw927q
  - &ro age17gc0nufm6gwnshlg7fuytdj9hmy27y06rzq8hcr6tv764hfccavswdek5r
  - &dah age1nu0ltg42na0x2fmr4lq7rh6a7xwwpgyjnk4ey0cjm60g0ej2w9wsrc7yfl
  - &joor age1dyx6ej446fhg7zgvs9ldjqcg77dxldd9mj3q3klxvfsg8mr54fwsd3nuuk
  - &zah age1zecjn7d4f364fku7n6s7mktwzpklqt0u0an0edjykmg59sgj743q8fvmkx
  - &frul age1a230t20a7jl2ce5w9axz8caajgk2s4w6ry2cvy52l2vupf685ujsrhfsdl
  # skyforge: also from its ssh_host_ed25519_key.pub via ssh-to-age.
  - &skyforge age1z95v2ahfghn34yg2yl8k3crtqtraqg6mnvvzq2audzr96savcqxs5p7yfe
  # guevenne: also from its ssh_host_ed25519_key.pub via ssh-to-age.
  - &guevenne age1wht0shv9rw22tmcnuvmzpywxsfzv0ujgswsuc0nuw72p7g3p4scqzdmxv8
  - &k8s-operator age1zd28lg5yxxc06jnyym92fep4gdwwnk3k3my9l247pvskjdj8mv4sa89d08
  # paper: an offline age key written on paper, kept out of every machine. Second
  # recipient on secrets that must survive losing *ngarvey (pki/).
  - &paper age15entx47hsg4rgdmrasv9yxthgk3tdk0r3jfjxha7nz2gsskqfaksw5xv42
creation_rules:
  # The private root CA key (pki/README.md). No machine is a recipient: it is
  # decrypted only on talos, by the user, to sign intermediates.
  - path_regex: pki/root-key\.yaml$
    key_groups:
    - age:
      - *ngarvey
      - *paper
  - path_regex: secrets/frigate.yaml
    key_groups:
    - age:
      - *ngarvey
      - *lydia
  - path_regex: secrets/garage.yaml
    key_groups:
    - age:
      - *ngarvey
      - *lydia
      - *wabbajack
      - *workstation
  # garage-acme: the TSIG key for the garage nodes' DNS-01 challenges.
  #   - dragonsreach serves the zone, so knot-auth needs the same key to
  #     validate the updates (modules/containers/knot-auth.nix).
  #   - lydia + wabbajack run lego. Every garage node holds this key; the Knot
  #     ACL is scoped to the one owner name they all write, not to a host, so
  #     adding a node is just another recipient here.
  - path_regex: secrets/garage-acme.yaml
    key_groups:
    - age:
      - *ngarvey
      - *dragonsreach
      - *lydia
      - *wabbajack
  # rgw-acme: TSIG secret for the acme-rgw key (ACME DNS-01 for
  # rgw.home.garvey.sh). dragonsreach holds it for Knot; each Ceph node runs
  # lego for its own copy of the certificate (modules/services/ceph.nix).
  - path_regex: secrets/rgw-acme.yaml
    key_groups:
    - age:
      - *ngarvey
      - *dragonsreach
      - *joor
      - *zah
      - *frul
  # OpenBao on fus, ro and dah (modules/services/openbao.nix, docs/openbao.md).
  #   openbao: the static seal key every node unseals with at boot.
  #   openbao-acme: TSIG secret for the acme-openbao key (listener certificates);
  #     dragonsreach holds it for Knot.
  #   openbao-snapshot: the snapshot timer's AppRole credentials and its RGW key.
  #   openbao-recovery: the recovery key from init; *paper so it survives losing
  #     *ngarvey, no machine.
  #   openbao-admin: the offline admin login key and the OpenTofu state passphrase
  #     (pki/openbao/); same recipients as the recovery key.
  - path_regex: secrets/openbao\.yaml$
    key_groups:
    - age:
      - *ngarvey
      - *paper
      - *fus
      - *ro
      - *dah
  - path_regex: secrets/openbao-acme\.yaml$
    key_groups:
    - age:
      - *ngarvey
      - *dragonsreach
      - *fus
      - *ro
      - *dah
  # Knot's copy of cert-manager's TSIG key (modules/containers/knot-auth.nix);
  # cert-manager's copy is k8s/manifests/cert-manager/secret.yaml.
  - path_regex: secrets/cert-manager-acme\.yaml$
    key_groups:
    - age:
      - *ngarvey
      - *dragonsreach
  # Hosts' TSIG keys for their pki-dns certificate (modules/services/pki-dns-cert.nix),
  # readable by Knot's host and the host itself.
  - path_regex: secrets/pki-dns-lydia\.yaml$
    key_groups:
    - age:
      - *ngarvey
      - *dragonsreach
      - *lydia
  - path_regex: secrets/openbao-snapshot\.yaml$
    key_groups:
    - age:
      - *ngarvey
      - *fus
      - *ro
      - *dah
  #   openbao-talos-builder: AppRole for talos's nix-ssh certificate (`workstation`
  #     is talos's age key).
  #   openbao-builder-host: AppRole for the build helpers' SSH host certificates.
  - path_regex: secrets/openbao-talos-builder\.yaml$
    key_groups:
    - age:
      - *ngarvey
      - *workstation
  - path_regex: secrets/openbao-builder-host\.yaml$
    key_groups:
    - age:
      - *ngarvey
      - *lydia
      - *wabbajack
  - path_regex: secrets/openbao-(recovery|admin)\.yaml$
    key_groups:
    - age:
      - *ngarvey
      - *paper
  # skyforge-acme: TSIG secret for the acme-skyforge key (ACME DNS-01 for
  # skyforge.home.garvey.sh). dragonsreach holds it for Knot; skyforge runs lego
  # (hosts/skyforge/web-gate.nix).
  - path_regex: secrets/skyforge-acme.yaml
    key_groups:
    - age:
      - *ngarvey
      - *dragonsreach
      - *skyforge
  # skyforge-orca: the API key OrcaSlicer sends as X-Api-Key. skyforge's nginx
  # checks it (hosts/skyforge/web-gate.nix); `workstation` lets talos and
  # dovahkiin install it into OrcaSlicer's printer preset.
  - path_regex: secrets/skyforge-orca.yaml
    key_groups:
    - age:
      - *ngarvey
      - *skyforge
      - *workstation
  # rgw-sts: rgw_sts_key, which encrypts RGW's STS session tokens; the same on
  # every RGW (modules/services/ceph.nix).
  - path_regex: secrets/rgw-sts.yaml
    key_groups:
    - age:
      - *ngarvey
      - *joor
      - *zah
      - *frul
  # llm-models: dedicated garage S3 key for the LLM model store.
  #   - dovahkiin + wabbajack present their own host keys; dovahkiin runs the
  #     hf-to-garage upload tool. wabbajack has no consumer of this secret.
  #   - `workstation` is the identity talos presents (same one that decrypts
  #     garage.yaml).
  # ngarvey is included so the secret can be edited.
  - path_regex: secrets/llm-models.yaml
    key_groups:
    - age:
      - *ngarvey
      - *workstation
      - *dovahkiin
      - *wabbajack
  - path_regex: secrets/dragonsreach.yaml
    key_groups:
    - age:
      - *ngarvey
      - *dragonsreach
  # k3s-server: the server token (joins servers; with it a node can fetch the
  # cluster CA keys, i.e. full admin) and the agent token the servers accept.
  # Only the servers can decrypt it.
  - path_regex: secrets/k3s-server.yaml
    key_groups:
    - age:
      - *ngarvey
      - *fus
      - *ro
      - *dah
  # k3s-agent: the agent token joor/zah/frul join with, in K10<ca-hash>:: form
  # so they check the cluster CA before sending it. It joins agents only.
  - path_regex: secrets/k3s-agent.yaml
    key_groups:
    - age:
      - *ngarvey
      - *joor
      - *zah
      - *frul
  # ceph-admin: a recovery copy of the Ceph client.admin keyring. Only ngarvey
  # can decrypt it; no host needs it, since each storage node keeps its own
  # /etc/ceph/ceph.client.admin.keyring. With any one mon still up, this key is
  # enough to administer the cluster and re-issue every other key.
  - path_regex: secrets/ceph-admin.yaml
    key_groups:
    - age:
      - *ngarvey
  # ceph-backup: the Garage key for the `ceph-backup` bucket and the Kopia
  # repository password. joor runs the backups (modules/services/ceph-backup.nix);
  # ngarvey is here so the backups can be restored from any machine if joor is
  # gone: without the password the repository is unreadable.
  - path_regex: secrets/ceph-backup.yaml
    key_groups:
    - age:
      - *ngarvey
      - *joor
  # llm-api-keys: the hosted-LLM API keys pi uses. `workstation` is the identity
  # both workstations present, so one recipient covers talos and dovahkiin.
  - path_regex: secrets/llm-api-keys.yaml
    key_groups:
    - age:
      - *ngarvey
      - *workstation
  # zot-push: the `auth` value (base64 of user:password) for pushing to the
  # oci.garvey.sh registry. `workstation` lets talos and dovahkiin install it as
  # ~/.config/containers/auth.json (modules/desktop/zot-push.nix). zot itself
  # holds only the bcrypt hash (k8s/manifests/zot/secret.yaml).
  - path_regex: secrets/zot-push.yaml
    key_groups:
    - age:
      - *ngarvey
      - *workstation
  # prometheus-remote-write: the password the Vector agent on every host sends
  # to prometheus.home.garvey.sh/api/v1/write (modules/services/vector-agent.nix).
  # Prometheus's Caddy sidecar holds only the bcrypt hash
  # (k8s/manifests/prometheus/secret.yaml). nelkir is missing until its host key
  # is added.
  - path_regex: secrets/prometheus-remote-write.yaml
    key_groups:
    - age:
      - *ngarvey
      - *workstation
      - *dovahkiin
      - *dragonsreach
      - *lydia
      - *wabbajack
      - *fus
      - *ro
      - *dah
      - *joor
      - *zah
      - *frul
      - *skyforge
      - *guevenne
  # celler-push: one push-only celler token per workstation, keyed by host
  # name, for `celler watch-store` (modules/desktop/celler-push.nix). Minted
  # with the key in secrets/celler-admin.yaml; the server checks them with its
  # public key only.
  - path_regex: secrets/celler-push.yaml
    key_groups:
    - age:
      - *ngarvey
      - *workstation
  # celler-admin: the RS256 private key that signs celler access tokens
  # (`celler admin make-token --signing-key`). The server holds only the public
  # key (k8s/manifests/celler/configmap.yaml); no host needs this.
  - path_regex: secrets/celler-admin.yaml
    key_groups:
    - age:
      - *ngarvey
  # loop-build: the six secrets the LoopWorkspace fork's GitHub Actions need
  # (Apple team ID, App Store Connect API key, GH_PAT, MATCH_PASSWORD), kept
  # here as the copy to restore from; GitHub holds them as repo secrets. No
  # host needs them.
  - path_regex: secrets/loop-build.yaml
    key_groups:
    - age:
      - *ngarvey
  - path_regex: secrets/smb-credentials.yaml
    key_groups:
    - age:
      - *ngarvey
      - *workstation
      - *wabbajack
      - *dovahkiin
      - *lydia
  # The SMB microvm's SSH host key: lydia stages it into the guest over virtiofs
  # (modules/microvm/smb.nix), so the key survives reboots.
  - path_regex: secrets/smb-vm-ssh-host-key.yaml
    key_groups:
    - age:
      - *ngarvey
      - *lydia
  # cephfs/<host>: each CephFS client host's own cephx key (client.<host>,
  # docs/ceph-bootstrap/06-cephfs.sh client <host>), read by
  # modules/services/cephfs-mount.nix. One file and rule per host, with that
  # host's identity as recipient: a host's key can be revoked and replaced
  # alone. A new client host gets its own rule here.
  - path_regex: secrets/cephfs/talos\.yaml$
    key_groups:
    - age:
      - *ngarvey
      - *workstation
  - path_regex: secrets/storj-gateway.yaml
    key_groups:
    - age:
      - *ngarvey
      - *dragonsreach
  # The Temporal UI's OIDC client secret, kept apart from temporal/secret.yaml.
  - path_regex: k8s/manifests/temporal/ui-oidc-secret\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
    - age:
      - *ngarvey
      - *k8s-operator
  # Secrets kept apart from their directory's secret.yaml: the litellm
  # role's Postgres password (postgres), the litellm virtual keys agent-token
  # hands out (agents), agent-token's copy of the habit-data JWT key
  # (agents; the habit-helper namespace holds the other copy), and the DeepSeek
  # key behind litellm's habit-helper model (litellm), and the Matrix
  # Authentication Service's keys (matrix), and the Matrix bridge's
  # appservice registration (agents; Synapse's copy is in matrix/secret.yaml),
  # and Habit Admin's keys: the bridge admin API's JWT key and its litellm
  # virtual key (agents), and litellm's copy of that virtual key (litellm).
  - path_regex: k8s/manifests/(postgres/litellm-secret|agents/litellm-keys-secret|agents/agent-token-habit-data-secret|litellm/deepseek-secret|matrix/mas-secret|agents/matrix-secret|agents/habit-admin-secret|litellm/habit-admin-key-secret)\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
    - age:
      - *ngarvey
      - *k8s-operator
  - path_regex: k8s/manifests/.*/secret\.yaml$
    # Only encrypt values under stringData and data keys
    encrypted_regex: "^(data|stringData)$"
    key_groups:
    - age:
      - *ngarvey
      - *k8s-operator
  # ESP32 firmware secrets (wifi, thread, ha). `workstation` and dovahkiin are
  # the machines that build and flash the devices.
  - path_regex: firmware/secrets/.*\.sops\.yaml$
    key_groups:
    - age:
      - *workstation
      - *dovahkiin
