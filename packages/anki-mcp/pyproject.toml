[project]
name = "anki-mcp"
version = "0.1.0"
description = "Anki MCP server for Claude: full control under the Duet deck, read-only elsewhere"
requires-python = ">=3.12"

[project.scripts]
anki-mcp = "anki_mcp.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
