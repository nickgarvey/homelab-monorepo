user nobody nobody;
daemon off;
error_log /dev/stderr info;

pid /dev/null;
events {}

http {
    access_log /dev/stdout;
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name nickgarvey.com;

        ssl_certificate /etc/nginx/certs/cloudflare.crt;
        ssl_certificate_key /etc/nginx/certs/cloudflare.key;

        index index.html;
        location / {
            root /data;
        }
    }
}