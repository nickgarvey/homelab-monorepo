# Values for the ceph-csi-rbd chart (version in chart.env), rendered by
# scripts/render-chart.sh; see vendor/README.md.
#
# The Ceph cluster is external: joor/zah/frul, run by NixOS
# (modules/services/ceph.nix). The StorageClass and the client Secret live in
# manifests/ceph-csi-rbd/, not here.
csiConfig:
  - clusterID: "8d324da3-f3ab-40f8-aaa1-71ed33705f75"
    # msgr2 (3300): the mons do not listen on msgr1 (6789).
    monitors:
      - "[2001:470:482f::24]:3300"
      - "[2001:470:482f::25]:3300"
      - "[2001:470:482f::26]:3300"

provisioner:
  replicaCount: 2

# NixOS has no SELinux.
selinuxMount: false

storageClass:
  create: false
secret:
  create: false

# The cluster is IPv6-only; librbd in the provisioner must bind IPv6.
cephconf: |
  [global]
    auth_cluster_required = cephx
    auth_service_required = cephx
    auth_client_required = cephx
    ms_bind_ipv6 = true
    ms_bind_ipv4 = false
