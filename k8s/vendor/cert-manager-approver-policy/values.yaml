# Values for the cert-manager-approver-policy chart (version in chart.env),
# rendered by scripts/render-chart.sh; see vendor/README.md.
#
# The policies it enforces are in manifests/cert-manager/cluster-policies.yaml.

app:
  # Only the cluster CA. cert-manager's own approver (vendor/cert-manager/values.yaml)
  # keeps approving every other issuer, so the ACME and self-signed issuers need
  # no policy.
  approveSignerNames:
    - clusterissuers.cert-manager.io/cluster-ca

# The cluster services run on fus/ro/dah.
nodeSelector:
  kubernetes.io/os: linux
  node-role.kubernetes.io/control-plane: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
