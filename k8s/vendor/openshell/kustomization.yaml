# The openshell render (scripts/render-chart.sh, never edited) with the
# gateway listening on IPv6.
# Apply with: kubectl apply -k vendor/openshell
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The chart leaves metadata.namespace off most of its namespaced objects.
namespace: openshell
resources:
  - openshell.yaml
patches:
  # The chart's gateway.toml hardcodes 0.0.0.0 for the gRPC, health and
  # metrics listeners, which accepts nothing in this IPv6-only cluster. The
  # gateway's OPENSHELL_* env vars take precedence over the file: the bind
  # address moves the gRPC listener, and setting a health/metrics port puts
  # that listener on the bind address too. The ports repeat the chart's
  # service.healthPort and service.metricsPort; check them on a chart bump.
  - target:
      kind: Deployment
      name: openshell
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openshell
      spec:
        template:
          spec:
            containers:
              - name: openshell-gateway
                env:
                  - name: OPENSHELL_BIND_ADDRESS
                    value: "::"
                  - name: OPENSHELL_HEALTH_PORT
                    value: "8081"
                  - name: OPENSHELL_METRICS_PORT
                    value: "9090"
  # The gateway's client certificate for the shared postgres
  # (manifests/openshell/postgres-client-certificate.yaml), which the chart has
  # no value for. The pod's fsGroup (1000) makes the 0440 key readable to the
  # gateway's user. The paths are the ones in manifests/openshell/db-secret.yaml.
  - target:
      kind: Deployment
      name: openshell
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openshell
      spec:
        template:
          spec:
            containers:
              - name: openshell-gateway
                volumeMounts:
                  - name: postgres-client
                    mountPath: /etc/openshell-pg
                    readOnly: true
            volumes:
              - name: postgres-client
                secret:
                  secretName: openshell-postgres-client
                  defaultMode: 0440
  # Certificate users (mtls_auth): a request without a bearer token becomes
  # the user named by its client certificate's CN, with its OU values as roles.
  # The chart has no value for it, and with an OIDC issuer the gateway leaves it
  # off unless asked. Authelia logins still work alongside it. The agents worker
  # logs in this way (manifests/agents/openshell-certificate.yaml). Client
  # certificates are verified against the chart's client-CA path, the ca.crt of
  # openshell-server-tls: the spiffe-ca root (below).
  - target:
      kind: Deployment
      name: openshell
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openshell
      spec:
        template:
          spec:
            containers:
              - name: openshell-gateway
                env:
                  - name: OPENSHELL_ENABLE_MTLS_AUTH
                    value: "true"
  # The gateway's server certificate and the chart's client certificate (the
  # CLI's and the supervisors' transport certificate) come from the spiffe-ca
  # ClusterIssuer, not the chart's own CA, whose 90-day lifetime is shorter
  # than theirs. Their Secrets' ca.crt is then the spiffe-ca root, which every
  # client of the gateway (the CLI, supervisors, peers, the agents worker)
  # trusts. The policies are spiffe-openshell-gateway and
  # spiffe-openshell-client in manifests/cert-manager/spiffe-policies.yaml.
  # The server certificate keeps only the names it is reached by, and no CN
  # (CN=openshell is the gateway's postgres login): the chart's
  # localhost and container-host names would be trusted by everything under
  # the root.
  - target:
      kind: Certificate
      name: openshell-server
    patch: |-
      - op: replace
        path: /spec/issuerRef
        value: {group: cert-manager.io, kind: ClusterIssuer, name: spiffe-ca}
      - op: replace
        path: /spec/dnsNames
        value:
          - openshell
          - openshell.openshell
          - openshell.openshell.svc
          - openshell.openshell.svc.cluster.local
          - gateway.openshell.k8s.home.garvey.sh
      - op: remove
        path: /spec/ipAddresses
      - op: remove
        path: /spec/commonName
  - target:
      kind: Certificate
      name: openshell-client
    patch: |-
      - op: replace
        path: /spec/issuerRef
        value: {group: cert-manager.io, kind: ClusterIssuer, name: spiffe-ca}
  # With both certificates above on spiffe-ca, nothing uses the chart's own CA
  # (its self-signed Issuer, the openshell-ca Certificate and the CA Issuer),
  # so it is not applied. A chart bump that points anything else at
  # openshell-ca-issuer fails to issue; re-check on a bump.
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: openshell-ca
        namespace: openshell
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: openshell-ca-issuer
        namespace: openshell
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: openshell-selfsigned
        namespace: openshell
