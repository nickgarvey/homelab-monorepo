# The openshell render (scripts/render-chart.sh, never edited) with the
# gateway's postgres client certificate, mTLS auth, OpenBao key and
# cluster-ca certificates.
# Apply with: kubectl apply -k vendor/openshell
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The chart leaves metadata.namespace off most of its namespaced objects.
namespace: openshell
resources:
  - openshell.yaml
patches:
  # The gateway's client certificate for the shared postgres
  # (manifests/openshell/postgres-client-certificate.yaml), which the chart has
  # no value for. The pod's fsGroup (1000) makes the 0440 key readable to the
  # gateway's user. The paths are the ones in manifests/openshell/db-secret.yaml.
  - target:
      kind: Deployment
      name: openshell
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openshell
      spec:
        template:
          spec:
            containers:
              - name: openshell-gateway
                volumeMounts:
                  - name: postgres-client
                    mountPath: /etc/openshell-pg
                    readOnly: true
            volumes:
              - name: postgres-client
                secret:
                  secretName: openshell-postgres-client
                  defaultMode: 0440
  # Certificate users (mtls_auth): a request without a bearer token becomes
  # the user named by its client certificate's CN, with its OU values as roles.
  # The chart has no value for it, and with an OIDC issuer the gateway leaves it
  # off unless asked. Authelia logins still work alongside it. The agents worker
  # logs in this way (manifests/agents/openshell-certificate.yaml). Client
  # certificates are verified against the chart's client-CA path, the ca.crt of
  # openshell-server-tls: the root (pki/root.crt) (below).
  - target:
      kind: Deployment
      name: openshell
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openshell
      spec:
        template:
          spec:
            containers:
              - name: openshell-gateway
                env:
                  - name: OPENSHELL_ENABLE_MTLS_AUTH
                    value: "true"
  # The key-encryption key comes from OpenBao
  # (manifests/openshell/secret-provider-class.yaml), not the openshell-kek
  # Secret the chart's existingSecret names. The gateway reads it only from the
  # variable gateway.toml names (its key_encryption_key_path mode wants raw
  # bytes in a file it can chmod), so env-from-files (packages/env-from-files),
  # copied in by an init container, sets it from the mounted file and execs
  # the image's entrypoint with the chart's args.
  - target:
      kind: Deployment
      name: openshell
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openshell
      spec:
        template:
          spec:
            initContainers:
              - name: env-from-files
                image: oci.garvey.sh/env-from-files:8bfld05lcsks4qkksbnjadzh7d64m83m
                args: ["install", "/opt/env-from-files"]
                volumeMounts:
                  - name: env-from-files
                    mountPath: /opt/env-from-files
                resources:
                  requests:
                    cpu: 10m
                    memory: 16Mi
                  limits:
                    memory: 32Mi
            containers:
              - name: openshell-gateway
                command:
                  - /opt/env-from-files/env-from-files
                  - /run/secrets/env
                  - "--"
                  - /usr/local/bin/openshell-gateway
                env:
                  - name: OPENSHELL_GATEWAY_CREDENTIAL_KEY_ENCRYPTION_KEY
                    $patch: delete
                volumeMounts:
                  - name: credentials
                    mountPath: /run/secrets/env
                    readOnly: true
                  - name: env-from-files
                    mountPath: /opt/env-from-files
                    readOnly: true
            volumes:
              - name: credentials
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: openshell
              - name: env-from-files
                emptyDir:
                  medium: Memory
                  sizeLimit: 8Mi
  # The gateway's server certificate and the chart's client certificate (the
  # CLI's and the supervisors' transport certificate) come from the cluster-ca
  # ClusterIssuer, not the chart's own CA, whose 90-day lifetime is shorter
  # than theirs. Their Secrets' ca.crt is then the root (pki/root.crt), which every
  # client of the gateway (the CLI, supervisors, peers, the agents worker)
  # trusts. The policies are cluster-openshell-gateway and
  # cluster-openshell-client in manifests/cert-manager/cluster-policies.yaml.
  # The server certificate keeps only the names it is reached by, and no CN
  # (CN=openshell is the gateway's postgres login): the chart's
  # localhost and container-host names would be trusted by everything under
  # the root.
  - target:
      kind: Certificate
      name: openshell-server
    patch: |-
      - op: replace
        path: /spec/issuerRef
        value: {group: cert-manager.io, kind: ClusterIssuer, name: cluster-ca}
      - op: replace
        path: /spec/dnsNames
        value:
          - openshell.openshell.svc
          - openshell.openshell.svc.cluster.local
          - gateway.openshell.k8s.home.garvey.sh
      - op: remove
        path: /spec/ipAddresses
      - op: remove
        path: /spec/commonName
  - target:
      kind: Certificate
      name: openshell-client
    patch: |-
      - op: replace
        path: /spec/issuerRef
        value: {group: cert-manager.io, kind: ClusterIssuer, name: cluster-ca}
  # With both certificates above on cluster-ca, nothing uses the chart's own CA
  # (its self-signed Issuer, the openshell-ca Certificate and the CA Issuer),
  # so it is not applied. A chart bump that points anything else at
  # openshell-ca-issuer fails to issue; re-check on a bump.
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: openshell-ca
        namespace: openshell
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: openshell-ca-issuer
        namespace: openshell
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: openshell-selfsigned
        namespace: openshell
