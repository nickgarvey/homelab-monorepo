agentSandbox:
  preflight:
    # The preflight check looks up the Sandbox CRD in the live cluster and
    # fails the render when it is absent, which it always is offline.
    enabled: false

# The chart's certgen hook never runs (hooks are not rendered), and
# cert-manager is already in the cluster. The JWT-only half of that hook is
# manifests/openshell/jwt-keys-job.yaml.
certManager:
  enabled: true
  # The gateway.toml server_sans; the server certificate's own names are set
  # by a patch in kustomization.yaml. The chart's defaults plus the LAN
  # LoadBalancer's k8s_gateway name (manifests/openshell/service-lb.yaml).
  # Setting the list replaces the defaults, so they are repeated; re-check
  # them on a chart bump.
  serverDnsNames:
    - openshell
    - openshell.openshell.svc
    - openshell.openshell.svc.cluster.local
    - localhost
    - openshell.localhost
    - "*.openshell.localhost"
    - host.docker.internal
    - gateway.openshell.k8s.home.garvey.sh
pkiInitJob:
  enabled: false

workload:
  # A Deployment, not the chart's StatefulSet: the state is in postgres, so the
  # pod needs no volume of its own.
  kind: deployment

server:
  # The shared postgres (manifests/postgres/) instead of the chart's SQLite
  # file. The chart reads OPENSHELL_DB_URL from this Secret's `uri` key. The URL
  # holds no password: the gateway logs in with a client certificate mounted by
  # kustomization.yaml. The Secret is manifests/openshell/db-secret.yaml.
  externalDbSecret: openshell-db
  credentialStorage:
    # Without this the chart renders the key-encryption key from `lookup` and
    # `randBytes`, so every offline render (and every apply) gets a new key.
    # The Secret comes from manifests/openshell/secret.yaml (sops).
    existingSecret: openshell-kek
  # CLI users log in through Authelia (manifests/authelia, client
  # openshell-cli). This is what authenticates people; programs log in with a
  # client certificate (mtls_auth, kustomization.yaml). With an issuer set, the
  # gateway makes client certificates optional but still verifies any it is
  # given.
  oidc:
    issuer: https://auth.home.garvey.sh
    # Roles are Authelia groups, which the openshell-cli claims policy puts in
    # the access token. Leaving the roles empty does not give the auth-only
    # mode the chart docs describe: the chart then omits them and the gateway
    # falls back to openshell-admin/openshell-user, which Authelia never
    # issues. admins is the group Grafana also makes Admin; the admin role
    # passes user checks too. Put a user in openshell for non-admin access.
    rolesClaim: groups
    adminRole: admins
    userRole: openshell

# Provider token grants with SPIFFE: the driver mounts the SPIRE Workload API
# socket (csi.spiffe.io) into each sandbox's supervisor pod, never into the
# workload pod where the agent runs. For a provider whose profile has a
# token_grant, the supervisor fetches a JWT-SVID, trades it at the profile's
# token endpoint and injects the token it gets into the proxied request. The
# supervisor's identity, spiffe://home.garvey.sh/agent/<type>/<sandbox-id>,
# is the openshell-sandboxes ClusterSPIFFEID in vendor/spire/values.yaml. The
# chart also mounts the socket into the gateway pod (identity
# ns/openshell/sa/openshell), which only token_exchange grants use.
gatewayConfig:
  openshell.drivers.kubernetes:
    provider_spiffe_workload_api_socket_path: /spiffe-workload-api/spire-agent.sock

# The gateway, supervisor and sandbox runtime are our own builds of the chart's
# version with two patches: packages/openshell, pushed to
# oci.garvey.sh/openshell/<name>:<tag> and pinned by digest.
# NVIDIA/OpenShell#3702 (IPv6 policy DNS egress): upstream's policy DNS
# answers every AAAA query with NODATA, so in this IPv6-only cluster no sandbox
# could resolve any name (nix-lNoiG). The template-labels patch copies the
# sandbox template's labels onto the supervisor pod, for its SPIFFE ID
# (nix-q7Q31). Drop each patch (and its deadline check in agents/outputs.nix)
# once a release includes it, and go back to the chart's images when none is
# left. A rebuild changes the digests: push it and update all three here, and
# the gateway's in manifests/openshell/jwt-keys-job.yaml.
global:
  image:
    registry: oci.garvey.sh
gateway:
  image:
    digest: sha256:a46429242f4041d2b6d886e3b255f9d78d15181bafa0ce025859f7d8e414cbaa
supervisor:
  image:
    digest: sha256:c83826c1bc6c646e5827ecdc0ea68b72462a35e53c1435fef8a21a122ad1349b
sandboxRuntime:
  image:
    digest: sha256:561c63acbc7f247c452d83e90d92623403d66a7eed031e23b809ac3d4177b885
