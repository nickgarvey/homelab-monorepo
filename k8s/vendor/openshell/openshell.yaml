# Source: helm-chart/templates/role.yaml
# SPDX-FileCopyrightText: Copyright (c) 2025-2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openshell-sandbox
  namespace: openshell
  labels:
    helm.sh/chart: helm-chart-0.1.2
    app.kubernetes.io/name: openshell
    app.kubernetes.io/instance: openshell
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
      - sandboxes/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
  # Per-sandbox identity: TokenReview authenticates the projected token from
  # the configured sandbox service account, then the gateway resolves the
  # returned pod name and UID to its immutable sandbox labels. The driver also
  # creates and deletes the directly managed supervisor Pod. PATCH removes the
  # driver-owned bootstrap scheduling gate after immutable bootstrap material
  # has been created.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["secrets"]
    # Bootstrap Secrets are generation-scoped. Recovery deletes them by exact
    # name.
    verbs: ["create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get"]

