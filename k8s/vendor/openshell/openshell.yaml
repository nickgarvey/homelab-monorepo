# Source: helm-chart/templates/deployment.yaml
# SPDX-FileCopyrightText: Copyright (c) 2025-2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshell
  labels:
    helm.sh/chart: helm-chart-0.1.2
    app.kubernetes.io/name: openshell
    app.kubernetes.io/instance: openshell
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshell
      app.kubernetes.io/instance: openshell
  template:
    metadata:
      annotations:
        # Roll the gateway workload when the rendered gateway TOML changes - the
        # gateway only reads /etc/openshell/gateway.toml at startup, so without
        # this annotation a `helm upgrade` that only mutates the ConfigMap would
        # leave pods running with stale config.
        checksum/gateway-config: 248d78f1301b4e4614e670f074fe8cc1606eadb415e214dcff5d71866956e9c3
      labels:
        helm.sh/chart: helm-chart-0.1.2
        app.kubernetes.io/name: openshell
        app.kubernetes.io/instance: openshell
        app.kubernetes.io/version: "0.1.2"
        app.kubernetes.io/managed-by: Helm
    spec:
      terminationGracePeriodSeconds: 5
      serviceAccountName: openshell
      securityContext:
        fsGroup: 1000
      containers:
        - name: openshell-gateway
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            runAsUser: 1000
          image: "ghcr.io/nvidia/openshell/gateway@sha256:676297600ffa01aa52500e95c7fbb2bdaa11e4a08d35f731f6ad0a90f73a0a8d"
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/openshell/gateway.toml
          env:
            - name: OPENSHELL_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPENSHELL_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPENSHELL_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPENSHELL_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OPENSHELL_PEER_ENDPOINT
              value: "https://$(OPENSHELL_POD_IP):8080"
            - name: OPENSHELL_SERVICE_ACCOUNT_NAME
              value: "openshell"
            - name: OPENSHELL_PEER_SERVICE_NAME
              value: "openshell-peer"
            - name: OPENSHELL_PEER_TOKEN_AUDIENCE
              value: "openshell-gateway-peer"
            - name: OPENSHELL_PEER_SERVICE_ACCOUNT_TOKEN_FILE
              value: /var/run/secrets/openshell-peer/token
            - name: OPENSHELL_PEER_POD_LABELS
              value: "app.kubernetes.io/name=openshell,app.kubernetes.io/instance=openshell"
            - name: OPENSHELL_PEER_TLS_SERVER_NAME
              value: "openshell.openshell.svc.cluster.local"
            - name: OPENSHELL_PEER_TLS_CA_FILE
              value: /etc/openshell-tls/server/ca.crt
            - name: OPENSHELL_PEER_TLS_CERT_FILE
              value: /etc/openshell-tls/peer-client/tls.crt
            - name: OPENSHELL_PEER_TLS_KEY_FILE
              value: /etc/openshell-tls/peer-client/tls.key
            - name: OPENSHELL_GATEWAY_CREDENTIAL_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: openshell-kek
                  key: key-encryption-key
            - name: OPENSHELL_DB_URL
              valueFrom:
                secretKeyRef:
                  name: openshell-db
                  key: uri
            # Most gateway settings live in the ConfigMap-backed TOML file
            # mounted at /etc/openshell/gateway.toml. Secret-bearing settings use
            # env vars that the TOML references by name. Some process-level
            # settings consumed by libraries outside gateway code also remain here.
            - name: OPENSHELL_TELEMETRY_ENABLED
              value: "true"
          volumeMounts:
            # ConfigMap directory mounts expose keys through atomic-writer symlinks,
            # while the gateway intentionally rejects symlinked configuration.
            # The checksum annotation above rolls pods when this subPath changes.
            - name: gateway-config
              mountPath: /etc/openshell/gateway.toml
              subPath: gateway.toml
              readOnly: true
            - name: sandbox-jwt
              mountPath: /etc/openshell-jwt
              readOnly: true
            - name: gateway-peer-token
              mountPath: /var/run/secrets/openshell-peer
              readOnly: true
            - name: tls-cert
              mountPath: /etc/openshell-tls/server
              readOnly: true
            - name: peer-client-tls
              mountPath: /etc/openshell-tls/peer-client
              readOnly: true
            - name: tls-client-ca
              mountPath: /etc/openshell-tls/client-ca
              readOnly: true
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            {}
      volumes:
        - name: gateway-config
          configMap:
            name: openshell-config
        - name: sandbox-jwt
          secret:
            secretName: openshell-jwt-keys
            defaultMode: 256
        - name: gateway-peer-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  audience: openshell-gateway-peer
                  expirationSeconds: 3600
        - name: tls-cert
          secret:
            secretName: openshell-server-tls
        - name: peer-client-tls
          secret:
            secretName: openshell-client-tls
        - name: tls-client-ca
          secret:
            secretName: openshell-server-tls
            items:
              - key: ca.crt
                path: ca.crt

