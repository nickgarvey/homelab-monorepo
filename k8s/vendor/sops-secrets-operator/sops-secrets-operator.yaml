---
# Source: sops-secrets-operator/templates/operator.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sops-secrets-operator
  labels:
    app.kubernetes.io/name: sops-secrets-operator
    helm.sh/chart: sops-secrets-operator-0.23.1
    app.kubernetes.io/instance: sops-secrets-operator
    app.kubernetes.io/version: "0.17.1"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sops-secrets-operator
      app.kubernetes.io/instance: sops-secrets-operator
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: sops-secrets-operator
      labels:
        control-plane: controller-sops-secrets-operator
        app.kubernetes.io/name: sops-secrets-operator
        app.kubernetes.io/instance: sops-secrets-operator
    spec:
      serviceAccountName: sops-secrets-operator
      containers:
        - name: sops-secrets-operator
          image: "isindir/sops-secrets-operator:0.17.1"
          imagePullPolicy: IfNotPresent
          volumeMounts:
          - name: sops-age-key
            mountPath: /etc/sops-age-key
            readOnly: true
          command:
          - /usr/local/bin/manager
          args:
          # The address the metric endpoint binds to. (default ":8080")
          #- "-metrics-bind-address=127.0.0.1:8080"
          - "-health-probe-bind-address=:8081"
          # Enable leader election for controller manager. Enabling this will ensure there is only one active controller manager.
          - "-leader-elect"
          - "-requeue-decrypt-after=5"
          - "-zap-devel=false"
          - "-zap-encoder=json"
          - "-zap-log-level=info"
          - "-zap-stacktrace-level=error"
          - "-zap-time-encoding=iso8601"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SOPS_AGE_KEY_FILE
              value: "/etc/sops-age-key/keys.txt"
          resources:
            {}
      volumes:
      - name: sops-age-key
        secret:
          secretName: sops-age-key
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
