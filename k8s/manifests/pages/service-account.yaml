# Its SPIFFE ID, spiffe://home.garvey.sh/ns/pages/sa/pages, is what the RGW
# role `pages` trusts (modules/services/rgw-roles.nix).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pages
  namespace: pages
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
