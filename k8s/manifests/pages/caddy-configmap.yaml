# Caddy for pages.home.garvey.sh: TLS, an Authelia login on every request, then
# the object from the RGW bucket `pages`.
#
# forward_auth asks Authelia (/api/authz/ext-authz) about each request; its
# access rule for this name lets in only ngarvey (k8s/manifests/authelia/
# configmap.yaml). Without a session the browser is redirected to the portal.
# file_server serves <path>/index.html for a directory; a directory without one
# gets a listing, newest first. S3 folders have no timestamp, so they sort
# below the files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pages-caddy
  namespace: pages
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  Caddyfile: |
    {
      # The reload container reaches the admin API on the pod's loopback.
      admin 127.0.0.1:2019
      auto_https off
      filesystem pages s3 {
        bucket pages
        region default
        endpoint https://rgw.home.garvey.sh
        use_path_style
      }
    }
    https://pages.home.garvey.sh {
      tls /certs/tls.crt /certs/tls.key

      # Authelia's ext-authz endpoint, not forward-auth: forward-auth reads the
      # target from X-Forwarded-Host, which Authelia's own Caddy sidecar
      # replaces with auth.home.garvey.sh for any client it does not trust.
      # ext-authz reads it from Host and the path after the endpoint, which
      # the sidecar passes on unchanged.
      forward_auth https://authelia-https.authelia.svc.cluster.local {
        # The prefix ends in a slash, as in Authelia's Envoy example: Authelia
        # strips "/api/authz/ext-authz/" and keeps the rest, {uri}, as the path.
        uri /api/authz/ext-authz/{uri}
        copy_headers Remote-User
        header_up Host {host}
        transport http {
          tls_server_name auth.home.garvey.sh
        }
      }

      header {
        Strict-Transport-Security "max-age=31536000"
        X-Content-Type-Options nosniff
        Referrer-Policy same-origin
        -Server
      }

      # Directory listings are never cached. S3 folders have no timestamp, so a
      # listing's Last-Modified is always year 1 and a revalidating browser
      # would get 304 Not Modified forever, however the folder changes.
      @dir path */
      request_header @dir -If-Modified-Since
      request_header @dir -If-None-Match
      header @dir Cache-Control no-store

      file_server {
        fs pages
        browse {
          sort time desc
        }
      }
    }
