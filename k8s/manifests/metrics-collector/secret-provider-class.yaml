# metrics-collector's credentials, read from OpenBao (docs/openbao.md, "Pod
# secrets") and mounted by deployment.yaml as one file per key, which Vector's
# directory secret backend reads (configmap.yaml). Values: secrets/openbao/metrics-collector/metrics-collector.yaml.
# nightscout-token: the access token of the Nightscout subject
# metrics-collector, which has only the readable role
# (manifests/nightscout/README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-collector
  namespace: metrics-collector
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: metrics-collector
  namespace: metrics-collector
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: metrics-collector.metrics-collector
    objects: |
      - objectName: nightscout-token
        secretPath: kv/data/k8s/metrics-collector/metrics-collector/credentials
        secretKey: nightscout-token
