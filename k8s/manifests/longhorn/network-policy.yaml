# Ingress policy for longhorn-system (ait nix-rI8Cl.1).
#
# Longhorn's manager API (:9500), recovery backend (:9503), UI (:8000) and the
# instance-manager engine/replica/iSCSI ports have no authentication to turn on,
# and Longhorn's own components call :9500 unauthenticated, so the protection is
# network-level: only Longhorn's own pods, the apiserver (admission webhook) and
# the local kubelet/iSCSI initiator get in. Everything else, the LAN included,
# is dropped. Before this, anyone on the LAN could drive the manager API (delete
# volumes, repoint backups, or run an image as the cluster-admin
# longhorn-support-bundle service account).
#
# Deliberately no blanket cluster/host/remote-node entities: node identities
# come from node IP addresses, which sit on the LAN /64.
#
# The UI is not exposed; use
#   kubectl -n longhorn-system port-forward svc/longhorn-frontend 8080:80
# (port-forward enters the pod's own network namespace, so this policy does not
# apply to it).
#
# Callers were mapped with hubble on 2026-09-28: pod-to-pod traffic inside the
# namespace, kube-apiserver -> longhorn-manager :9502, and the local host ->
# csi-plugin :9808 / manager :9502 (kubelet probes) and instance-manager :3260
# (the node's own iSCSI initiator).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-ingress
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  description: "Longhorn: only its own pods, the apiserver webhook call and local kubelet/iSCSI"
  endpointSelector: {}
  ingress:
    # Every Longhorn pod may reach every other one on any port: manager API
    # :9500 (CSI plugin, UI, other managers), engine/replica ports, 8500-8503.
    - fromEndpoints:
        - {}
    # Admission webhook (longhorn-admission-webhook -> longhorn-manager :9502),
    # called by the apiserver on fus/ro/dah.
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9502"
              protocol: TCP
    # The local node only: kubelet probes (csi-plugin :9808, manager :9502) and
    # the node's iSCSI initiator attaching Longhorn volumes (instance-manager
    # :3260). Also covers the apiserver's webhook call when it runs on the same
    # node as the manager pod.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9808"
              protocol: TCP
            - port: "9502"
              protocol: TCP
            - port: "3260"
              protocol: TCP
