apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: node-down-pod-deletion-policy
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
value: delete-both-statefulset-and-deployment-pod
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: default-replica-count
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
value: "3"
---
# Reserve 10% of each default disk; the remaining ~90% is schedulable for Longhorn
# replicas. Applies only to newly-created default disks.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: storage-reserved-percentage-for-default-disk
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
value: "10"
---
# Auto-delete orphaned replica data directories and orphaned runtime instances.
# Orphans are stale replica copies left behind by rebuilds/relocations or
# interrupted cleanups; with this off they accumulate and consume disk.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: orphan-resource-auto-deletion
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
value: "replica-data;instance"
---
# Retention before an orphan is deleted (seconds). 2 days = 172800s.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: orphan-resource-auto-deletion-grace-period
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
value: "172800"
---
# Only nodes labelled node.longhorn.io/create-default-disk=true get a default
# disk. fus/ro/dah already have theirs; joor/zah/frul are Ceph storage nodes
# (modules/services/ceph.nix) and must not become Longhorn
# replica targets, since Longhorn is being replaced by Ceph.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: create-default-disk-labeled-nodes
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
value: "true"
---
# Longhorn runs only on fus/ro/dah (the k3s servers), which hold the
# monitoring volumes and are independent of Ceph on joor/zah/frul. This pins
# its system-managed components (instance managers, engine images, CSI);
# the manager, driver deployer and UI get the same nodeSelector in
# vendor/longhorn/values.yaml. Changing it requires every volume detached.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: system-managed-components-node-selector
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
value: "node-role.kubernetes.io/control-plane:true"
---
# fus/ro/dah carry the control-plane NoSchedule taint; Longhorn's components
# must tolerate it.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: taint-toleration
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
value: "node-role.kubernetes.io/control-plane:NoSchedule"
