# Registers the virtual keys with litellm, each with its alias and the only
# models it may call. The keys and the master key come from OpenBao
# (secrets/openbao/litellm/litellm-register-keys.yaml, mounted by
# secret-provider-class.yaml); agent-token hands the same virtual keys out
# (secrets/openbao/agents/agent-token.yaml). A key
# litellm already has gets its model list (and budget, if it has one) set
# again; its spend is kept, so
# the Job is safe to re-run, and it is how a lost database gets the keys back.
# It waits for litellm to be ready, so it can go in with a litellm rollout. The
# finished Job deletes itself a day later; re-run it sooner with
# kubectl -n litellm delete job litellm-register-keys first.
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-register-keys
  namespace: litellm
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: litellm-register-keys
        app.kubernetes.io/managed-by: ngarvey-homelab
    spec:
      restartPolicy: Never
      serviceAccountName: litellm-register-keys
      automountServiceAccountToken: false
      containers:
        - name: register
          image: alpine:3.24
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              MASTER_KEY=$(cat /keys/master-key)
              apk add --no-cache curl >/dev/null
              api=http://litellm.litellm.svc.cluster.local:4000
              for i in $(seq 120); do
                curl -fsS -o /dev/null "$api/health/readiness" && break
                [ "$i" = 120 ] && { echo "litellm not ready"; exit 1; }
                sleep 5
              done

              # register <alias> <models as a JSON list> [extra JSON fields,
              # such as a budget]: the key is the file
              # named <alias>. /key/info is asked by the key's hash (as litellm
              # stores it), so the key itself never appears in a URL or a log.
              register() {
                key=$(cat "/keys/$1")
                hash=$(printf %s "$key" | sha256sum | cut -d' ' -f1)
                code=$(curl -sS -o /tmp/info -w '%{http_code}' \
                  -H "Authorization: Bearer $MASTER_KEY" "$api/key/info?key=$hash")
                case $code in
                  200) path=/key/update body="{\"key\":\"$key\",\"models\":$2${3:+,$3}}" ;;
                  404) path=/key/generate body="{\"key\":\"$key\",\"key_alias\":\"$1\",\"models\":$2${3:+,$3}}" ;;
                  *) echo "$1: key/info answered $code:"; cat /tmp/info; echo; exit 1 ;;
                esac
                printf %s "$body" | curl -sS -o /tmp/out -w '%{http_code}\n' \
                  -H "Authorization: Bearer $MASTER_KEY" -H 'Content-Type: application/json' \
                  --data-binary @- "$api$path" > /tmp/code
                if [ "$(cat /tmp/code)" != 200 ]; then
                  echo "$1: $path answered $(cat /tmp/code):"; cat /tmp/out; echo; exit 1
                fi
                echo "$1: $path, models $2${3:+, $3}"
              }

              register pi '["pi", "qwen3.8-flash-next"]'
              register habit-helper '["habit-helper"]'
              register habit-admin '["habit-admin"]'
              # The flake-bot's fixer (ait nix-b77Zn): $20 per 30 days, after
              # which litellm refuses it and the bot alerts instead.
              register flake-fixer '["flake-fixer"]' '"max_budget":20,"budget_duration":"30d"'
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        # One file per virtual key, named by its alias, and master-key, from
        # OpenBao (secret-provider-class.yaml).
        - name: keys
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: litellm-register-keys
