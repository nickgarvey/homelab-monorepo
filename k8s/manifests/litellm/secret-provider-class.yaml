# litellm's secrets, read from OpenBao (docs/openbao.md, "Pod secrets") and
# mounted by deployment.yaml as one file per variable at /run/secrets/env,
# which env-from-files turns into the variables litellm reads (configmap.yaml's
# os.environ/ references, and DATABASE_URL). Values: secrets/openbao/litellm/litellm.yaml.
#
# LITELLM_MASTER_KEY: the same value as master-key in
# secrets/openbao/litellm/litellm-register-keys.yaml (register-keys-job.yaml).
# DATABASE_URL: Prisma's URL for role litellm on the shared postgres, built
# from the role's password (secrets/k8s/postgres/postgres-litellm.yaml):
# sslcert is the CA that signs the
# server's certificate (postgres-ca.yaml), and sslaccept=strict checks the
# chain and the name.
# DEEPSEEK_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY: README.md, "DeepSeek",
# "OpenAI" and "Anthropic".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: litellm.litellm
    objects: |
      - objectName: LITELLM_MASTER_KEY
        secretPath: kv/data/k8s/litellm/litellm/litellm
        secretKey: LITELLM_MASTER_KEY
      - objectName: DATABASE_URL
        secretPath: kv/data/k8s/litellm/litellm/litellm
        secretKey: DATABASE_URL
      - objectName: DEEPSEEK_API_KEY
        secretPath: kv/data/k8s/litellm/litellm/deepseek
        secretKey: DEEPSEEK_API_KEY
      - objectName: OPENAI_API_KEY
        secretPath: kv/data/k8s/litellm/litellm/openai
        secretKey: OPENAI_API_KEY
      - objectName: ANTHROPIC_API_KEY
        secretPath: kv/data/k8s/litellm/litellm/anthropic
        secretKey: ANTHROPIC_API_KEY
---
# register-keys-job.yaml's secrets, mounted at /keys: one file per virtual key,
# named by its alias (the same values as in secrets/openbao/agents/agent-token.yaml),
# and master-key (the same value as LITELLM_MASTER_KEY above). Values:
# secrets/openbao/litellm/litellm-register-keys.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-register-keys
  namespace: litellm
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: litellm-register-keys
  namespace: litellm
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: litellm.litellm-register-keys
    objects: |
      - objectName: master-key
        secretPath: kv/data/k8s/litellm/litellm-register-keys/master
        secretKey: master-key
      - objectName: pi
        secretPath: kv/data/k8s/litellm/litellm-register-keys/virtual-keys
        secretKey: pi
      - objectName: habit-helper
        secretPath: kv/data/k8s/litellm/litellm-register-keys/virtual-keys
        secretKey: habit-helper
      - objectName: habit-admin
        secretPath: kv/data/k8s/litellm/litellm-register-keys/habit-admin
        secretKey: habit-admin
      - objectName: flake-fixer
        secretPath: kv/data/k8s/litellm/litellm-register-keys/flake-fixer
        secretKey: flake-fixer
