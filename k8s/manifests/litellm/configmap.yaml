# litellm's config: the models it serves and its settings. Every call needs a
# key: the master key, or a virtual key, which may call only the models it is
# registered with (README.md, "Keys"). Read at start: after a change,
# kubectl -n litellm rollout restart deploy/litellm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  config.yaml: |
    model_list:
      - model_name: qwen3.8-flash-next
        litellm_params:
          model: openai/qwen3.8-flash-next
          api_base: http://wabbajack.home.garvey.sh:8080/v1
          api_key: sk-unused
      # Claude Sonnet 5.5, for the habit-helper agent. The key comes from the
      # litellm-anthropic Secret; until the real one is in, calls to it fail
      # and everything else works.
      - model_name: habit-helper
        litellm_params:
          model: anthropic/claude-sonnet-5-5
          api_key: os.environ/ANTHROPIC_API_KEY
    litellm_settings:
      drop_params: true
    general_settings:
      # From the litellm Secret (deployment.yaml). Virtual keys live in the
      # litellm database (DATABASE_URL).
      master_key: os.environ/LITELLM_MASTER_KEY
