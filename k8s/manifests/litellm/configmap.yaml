# litellm's config: the models it serves and its settings. Every call needs a
# key: the master key, or a virtual key, which may call only the models it is
# registered with (README.md, "Keys"). Read at start: after a change,
# kubectl -n litellm rollout restart deploy/litellm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  config.yaml: |
    model_list:
      - model_name: qwen3.8-flash-next
        litellm_params:
          model: openai/qwen3.8-flash-next
          api_base: http://wabbajack.home.garvey.sh:8080/v1
          api_key: sk-unused
      # DeepSeek V4 Flash, for the pi agent, under its own name so it can move
      # back to qwen3.8-flash-next (or elsewhere) on its own.
      - model_name: pi
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY
      # GPT-6.1 Sol, for the habit-helper agent, with the key in
      # OPENAI_API_KEY (from OpenBao). Through OpenAI's Responses API: on Chat
      # Completions the model refuses function tools while it reasons.
      - model_name: habit-helper
        litellm_params:
          model: openai/responses/gpt-6.1-sol
          api_key: os.environ/OPENAI_API_KEY
      # DeepSeek V4 Flash again, for the habit-admin agent, under its own name
      # so it and pi can each move on their own.
      - model_name: habit-admin
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY
    litellm_settings:
      drop_params: true
    general_settings:
      # From OpenBao (secret-provider-class.yaml). Virtual keys live in the
      # litellm database (DATABASE_URL).
      master_key: os.environ/LITELLM_MASTER_KEY
