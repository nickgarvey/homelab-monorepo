apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  config.yaml: |
    model_list:
      - model_name: qwen3.8-flash-next
        litellm_params:
          model: openai/qwen3.8-flash-next
          api_base: http://wabbajack.home.garvey.sh:8080/v1
          api_key: sk-unused
    litellm_settings:
      drop_params: true
