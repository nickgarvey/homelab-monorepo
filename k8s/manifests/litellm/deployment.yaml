# litellm, the OpenAI-compatible proxy in front of the models (configmap.yaml).
# It answers only calls with a key (README.md, "Keys"): the master key comes
# from OpenBao with its other secrets (secret-provider-class.yaml), the virtual
# keys from the litellm database on the shared postgres, which it reaches over
# TLS, verified against postgres-ca.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        app.kubernetes.io/managed-by: ngarvey-homelab
      annotations:
        checksum/config: replace-on-config-change
    spec:
      serviceAccountName: litellm
      automountServiceAccountToken: false
      # Copies the static env-from-files binary (packages/env-from-files) into
      # the env-from-files volume for the litellm container's command.
      initContainers:
        - name: env-from-files
          image: oci.garvey.sh/env-from-files:8bfld05lcsks4qkksbnjadzh7d64m83m
          args: ["install", "/opt/env-from-files"]
          volumeMounts:
            - name: env-from-files
              mountPath: /opt/env-from-files
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          imagePullPolicy: IfNotPresent
          # LITELLM_MASTER_KEY, DATABASE_URL, DEEPSEEK_API_KEY and
          # OPENAI_API_KEY come from OpenBao as files
          # (secret-provider-class.yaml); env-from-files sets them, then runs
          # the image's entrypoint.
          command:
            - /opt/env-from-files/env-from-files
            - /run/secrets/env
            - "--"
            - /app/docker/prod_entrypoint.sh
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "4000"
            - "--host"
            - "::"
          ports:
            - containerPort: 4000
          # Ready once it is serving and reaches its database, so the Service
          # sends nothing to it while it starts.
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
            - name: env
              mountPath: /run/secrets/env
              readOnly: true
            - name: env-from-files
              mountPath: /opt/env-from-files
              readOnly: true
      volumes:
        - name: env
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: litellm
        - name: env-from-files
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: config
          configMap:
            name: litellm-config
        - name: postgres-ca
          configMap:
            name: postgres-ca
