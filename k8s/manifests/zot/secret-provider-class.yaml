# zot's secrets, read from OpenBao (docs/openbao.md, "Pod secrets"). Values:
# secrets/openbao/zot/zot.yaml.
# zot-s3: credentials, its Garage S3 key for image storage as an AWS shared
# credentials file (`[default]` profile), which zot reads through
# AWS_SHARED_CREDENTIALS_FILE (deployment.yaml).
# zot-auth: htpasswd, the bcrypt hash for the `ngarvey` push account (zot's
# http.auth.htpasswd). The credential itself is in secrets/zot-push.yaml, which
# installs it on the workstations as ~/.config/containers/auth.json; rotate
# both together.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot
  namespace: zot
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: zot-s3
  namespace: zot
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: zot.zot
    objects: |
      - objectName: credentials
        secretPath: kv/data/k8s/zot/zot/s3
        secretKey: credentials
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: zot-auth
  namespace: zot
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: zot.zot
    objects: |
      - objectName: htpasswd
        secretPath: kv/data/k8s/zot/zot/auth
        secretKey: htpasswd
