# Mimir's key for the Storj S3 gateway, read from OpenBao (docs/openbao.md,
# "Pod secrets") as an AWS shared credentials file (profile default) and
# mounted by statefulset.yaml at /run/secrets/s3/credentials. The s3 storage
# config has no static keys, so the objstore client's credential chain reads
# the file named by AWS_SHARED_CREDENTIALS_FILE. Values: secrets/openbao/mimir/mimir.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mimir
  namespace: mimir
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mimir-s3
  namespace: mimir
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: mimir.mimir
    objects: |
      - objectName: credentials
        secretPath: kv/data/k8s/mimir/mimir/s3
        secretKey: credentials
