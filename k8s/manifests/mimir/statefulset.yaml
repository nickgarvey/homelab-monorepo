apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: mimir
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
    app.kubernetes.io/name: mimir
spec:
  serviceName: mimir-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
    spec:
      serviceAccountName: mimir
      automountServiceAccountToken: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: mimir
          # Pinned: ":latest" + pullPolicy Always silently drifted to 3.x on a
          # node reboot and broke the ring config. Bump deliberately.
          image: grafana/mimir:3.1.2
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -config.expand-env=true
            - -target=all
          env:
            # Advertised to memberlist; status.podIP is the pod's IPv6.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The S3 key, from OpenBao (secret-provider-class.yaml).
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /run/secrets/s3/credentials
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9095
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
            - name: s3
              mountPath: /run/secrets/s3
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: s3
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mimir-s3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: longhorn-wffc
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
