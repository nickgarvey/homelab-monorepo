# The release-watch worker's identity: spiffe://home.garvey.sh/ns/release-watch/sa/release-watch
# to SPIRE (Temporal). Its token is mounted: the worker reads the image of
# each watched Deployment's pods (rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-watch
  namespace: release-watch
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
