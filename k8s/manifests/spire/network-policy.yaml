# Anyone may reach the spire chart's two LoadBalancers on their target ports:
# the OIDC discovery provider and the server API. Allow-only: the deny comes
# from manifests/cilium/pod-ingress-default-deny.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: spire-oidc-discovery-lb-ingress
  namespace: spire
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  description: "LoadBalancer target ports open to all"
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: spire
      app.kubernetes.io/name: spiffe-oidc-discovery-provider
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
# NixOS hosts' agents. Without an agent or admin SVID a caller may only
# attest (AttestAgent) or read the trust bundle (GetBundle), which is public.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: spire-server-lb-ingress
  namespace: spire
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  description: "LoadBalancer target ports open to all"
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: spire
      app.kubernetes.io/name: server
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
