# Registration entries for services on NixOS hosts (modules/services/spire-agent.nix).
# Each is parented to the host's x509pop agent ID, which comes from its pki-dns
# certificate CN and so survives renewals, and selects the service by its
# systemd unit. Host workload IDs are spiffe://home.garvey.sh/host/<host>/<service>.
# className must match the controller manager's (watchClassless is false).
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterStaticEntry
metadata:
  name: host-lydia-vector
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  className: spire-spire
  spiffeID: spiffe://home.garvey.sh/host/lydia/vector
  parentID: spiffe://home.garvey.sh/spire/agent/x509pop/lydia.home.garvey.sh
  selectors:
    - systemd:id:vector.service
---
# lydia's daily Home Assistant backup: an STS role in RGW
# (modules/services/rgw-roles.nix) trusts this ID.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterStaticEntry
metadata:
  name: host-lydia-homeassistant-backup
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  className: spire-spire
  spiffeID: spiffe://home.garvey.sh/host/lydia/homeassistant-backup
  parentID: spiffe://home.garvey.sh/spire/agent/x509pop/lydia.home.garvey.sh
  selectors:
    - systemd:id:homeassistant-backup.service
---
# The flake-bot Temporal worker on wabbajack (ait nix-b77Zn): its X.509-SVID
# is its client certificate to the Temporal frontend
# (manifests/temporal/authz-configmap.yaml), and its JWT-SVID gets RGW STS
# credentials for the update manifest (modules/services/rgw-roles.nix).
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterStaticEntry
metadata:
  name: host-wabbajack-flake-bot
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  className: spire-spire
  spiffeID: spiffe://home.garvey.sh/host/wabbajack/flake-bot
  parentID: spiffe://home.garvey.sh/spire/agent/x509pop/wabbajack.home.garvey.sh
  selectors:
    - systemd:id:flake-bot.service
