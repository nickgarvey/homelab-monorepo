# spiffe-helper keeps the pod's JWT-SVID (audience rgw.home.garvey.sh) in
# /run/rgw-token/jwt_svid.token, renewing it before it expires (TTL 1h).
# boto3 trades it for temporary credentials of the create-only role
# `pages-mcp` with RGW's STS (AssumeRoleWithWebIdentity), re-reading the file each
# time it does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-pages-spiffe-helper
  namespace: mcp-pages
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir = "/run/rgw-token"
    daemon_mode = true
    jwt_svids = [{ jwt_audience = "rgw.home.garvey.sh", jwt_svid_file_name = "jwt_svid.token" }]
    health_checks {
      listener_enabled = true
      bind_port = 8081
      liveness_path = "/live"
      readiness_path = "/ready"
    }
