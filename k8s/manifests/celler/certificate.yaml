apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: celler-tls
  namespace: celler
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretName: celler-tls
  dnsNames:
    - celler.home.garvey.sh
  issuerRef:
    name: letsencrypt-acmedns-prod
    kind: ClusterIssuer
