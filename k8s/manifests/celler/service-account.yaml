# cellerd's identity: spiffe://home.garvey.sh/ns/celler/sa/celler, the URI SAN in
# its postgres client certificate. It never talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: celler
  namespace: celler
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
