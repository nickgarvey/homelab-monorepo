apiVersion: v1
kind: Service
metadata:
  name: celler
  namespace: celler
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
  annotations:
    # Matched by the celler AAAA record in modules/networking/dns.nix.
    io.cilium/lb-ipam-ips: "2001:470:482f:2::5008"
spec:
  type: LoadBalancer
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector:
    app: celler
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
