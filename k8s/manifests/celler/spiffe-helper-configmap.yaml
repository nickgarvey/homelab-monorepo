# spiffe-helper keeps cellerd's JWT-SVID (audience rgw.home.garvey.sh) in
# /run/rgw-token/jwt_svid.token, renewing it before it expires (TTL 1h).
# cellerd trades it for temporary S3 credentials with RGW's STS
# (AssumeRoleWithWebIdentity) and re-reads the file each time it does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: celler-spiffe-helper
  namespace: celler
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir = "/run/rgw-token"
    daemon_mode = true
    jwt_svids = [{ jwt_audience = "rgw.home.garvey.sh", jwt_svid_file_name = "jwt_svid.token" }]
    health_checks {
      listener_enabled = true
      bind_port = 8081
      liveness_path = "/live"
      readiness_path = "/ready"
    }
