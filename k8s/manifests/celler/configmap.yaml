apiVersion: v1
kind: ConfigMap
metadata:
  name: celler-config
  namespace: celler
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  # No secrets here. S3 credentials come from RGW STS through the AWS_* web
  # identity variables in deployment.yaml. The database login is the client
  # certificate in postgres-client-certificate.yaml, mounted at /etc/celler-pg.
  server.toml: |
    listen = "[::]:8080"
    allowed-hosts = ["celler.home.garvey.sh"]
    api-endpoint = "https://celler.home.garvey.sh/"

    [database]
    url = "postgres://celler@postgres-rw.postgres.svc:5432/celler?sslmode=verify-full&sslrootcert=/etc/celler-pg/ca.crt&sslcert=/etc/celler-pg/tls.crt&sslkey=/etc/celler-pg/tls.key"

    # Ceph RGW (modules/services/ceph.nix). "default" is the zonegroup name.
    [storage]
    type = "s3"
    region = "default"
    bucket = "celler"
    endpoint = "https://rgw.home.garvey.sh"

    # Changing these after the first upload stops new NARs from reusing
    # existing chunks.
    [chunking]
    nar-size-threshold = 65536
    min-size = 16384
    avg-size = 65536
    max-size = 262144

    # Paths nobody has pulled for this long are deleted. A cache can override
    # it with `celler cache configure --retention-period`.
    [garbage-collection]
    default-retention-period = "90 days"

    [jwt]
    rs256-public-key-file = "/etc/celler/jwt-public.pem"
