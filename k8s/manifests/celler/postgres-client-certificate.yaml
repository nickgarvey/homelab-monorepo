# cellerd's login to the shared postgres: the CN is the postgres role, the URI
# SAN its SPIFFE ID. Issued by the SPIFFE CA only because
# manifests/cert-manager/spiffe-policies.yaml allows exactly this name here.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: celler-postgres-client
  namespace: celler
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretName: celler-postgres-client
  commonName: celler
  uris:
    - spiffe://home.garvey.sh/ns/celler/sa/celler
  usages:
    - client auth
    - digital signature
    - key encipherment
  # Short lived: sqlx reads the cert files on every new connection and pool
  # connections live at most 30 minutes, so cellerd picks up the renewed files
  # from the mounted Secret without a restart.
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: spiffe-ca
