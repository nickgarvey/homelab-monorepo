# The diabetes MCP server's Nightscout token (subject `mcp-diabetes`, role
# `readable` only), read from OpenBao (docs/openbao.md, "Pod secrets") and
# mounted by deployment.yaml as /run/secrets/nightscout/token. Values:
# secrets/openbao/mcp-diabetes/mcp-diabetes.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-diabetes
  namespace: mcp-diabetes
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mcp-diabetes
  namespace: mcp-diabetes
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: mcp-diabetes.mcp-diabetes
    objects: |
      - objectName: token
        secretPath: kv/data/k8s/mcp-diabetes/mcp-diabetes/nightscout
        secretKey: token
