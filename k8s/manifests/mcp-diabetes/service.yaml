# Reached only by the gateway in manifests/mcp, which proxies
# https://mcp.home.garvey.sh/diabetes/* here with the /diabetes prefix stripped.
apiVersion: v1
kind: Service
metadata:
  name: mcp-diabetes
  namespace: mcp-diabetes
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector:
    app: mcp-diabetes
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
