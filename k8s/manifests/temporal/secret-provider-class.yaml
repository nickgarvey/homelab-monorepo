# The UI's OIDC client secret, read from OpenBao (docs/openbao.md, "Pod
# secrets"): plaintext of the temporal-ui client secret whose pbkdf2 digest is
# in manifests/authelia/configmap.yaml. ui-deployment.yaml mounts it as a file,
# and env-from-files turns it into TEMPORAL_AUTH_CLIENT_SECRET, which the UI's
# config template reads. Values: secrets/openbao/temporal/temporal-ui.yaml (ServiceAccount
# temporal-ui, ui-service-account.yaml).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: temporal-ui
  namespace: temporal
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: temporal.temporal-ui
    objects: |
      - objectName: TEMPORAL_AUTH_CLIENT_SECRET
        secretPath: kv/data/k8s/temporal/temporal-ui/oidc
        secretKey: client-secret
