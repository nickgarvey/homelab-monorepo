# The workload identity spiffe://home.garvey.sh/ns/temporal/sa/temporal, which the
# client certificate in postgres-client-certificate.yaml carries as its URI SAN.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal
  namespace: temporal
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
