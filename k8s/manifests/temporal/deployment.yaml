apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: temporal
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
        app.kubernetes.io/managed-by: ngarvey-homelab
    spec:
      serviceAccountName: temporal
      securityContext:
        # Lets the temporal user (1000) read the client key from the Secret volume.
        fsGroup: 1000
      # Schema migrations, in order, before the server starts. The image is
      # packages/temporal-server: temporal-sql-tool with the schemas of the same
      # Temporal version embedded. A no-op when the schema is current. The
      # operator creates the databases (postgres/databases.yaml), so there is no
      # create-database or setup-schema step.
      initContainers:
        - name: schema
          image: &image oci.garvey.sh/temporal-server:1.29.7-ijj8znd
          imagePullPolicy: IfNotPresent
          command: [/bin/temporal-sql-tool]
          args: [--db, temporal, update-schema, --schema-name, postgresql/v12/temporal]
          env: &sqlTool
            - { name: SQL_PLUGIN, value: postgres12 }
            - { name: SQL_HOST, value: postgres-rw.postgres.svc }
            - { name: SQL_PORT, value: "5432" }
            - { name: SQL_USER, value: temporal }
            - { name: SQL_TLS, value: "true" }
            - { name: SQL_TLS_CA_FILE, value: /etc/temporal-pg/ca.crt }
            - { name: SQL_TLS_CERT_FILE, value: /etc/temporal-pg/tls.crt }
            - { name: SQL_TLS_KEY_FILE, value: /etc/temporal-pg/tls.key }
            - { name: SQL_TLS_SERVER_NAME, value: postgres-rw.postgres.svc }
          volumeMounts:
            - &pgMount
              name: postgres-client
              mountPath: /etc/temporal-pg
              readOnly: true
        - name: visibility-schema
          image: *image
          imagePullPolicy: IfNotPresent
          command: [/bin/temporal-sql-tool]
          args: [--db, temporal_visibility, update-schema, --schema-name, postgresql/v12/visibility]
          env: *sqlTool
          volumeMounts: [*pgMount]
      containers:
        - name: temporal
          image: *image
          imagePullPolicy: IfNotPresent
          # All five services in one process. internal-frontend is not in the
          # default set, so the list is explicit. --authz-table turns on
          # certificate-identity authorization (authz-configmap.yaml).
          args:
            - --root=/
            - --config=etc/temporal/config
            - --env=homelab
            - --authz-table=/etc/temporal/authz/table.yaml
            - start
            - --service=frontend
            - --service=internal-frontend
            - --service=history
            - --service=matching
            - --service=worker
          volumeMounts:
            - name: config
              mountPath: /etc/temporal/config
              readOnly: true
            - name: authz
              mountPath: /etc/temporal/authz
              readOnly: true
            - name: frontend-tls
              mountPath: /etc/temporal-frontend-tls
              readOnly: true
            - *pgMount
          ports:
            - containerPort: 9090
              name: metrics
          # gRPC health of the internal frontend on loopback: the frontend
          # requires a client certificate, which a kubelet gRPC probe cannot
          # present (and kubelet probes dial the pod IP, never loopback).
          readinessProbe:
            exec:
              command: [/bin/temporal-server, healthcheck]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: [/bin/temporal-server, healthcheck]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
        # The only listener on the pod IP besides metrics: forwards [::]:7233 to
        # the frontend on 127.0.0.1:7233 (config-configmap.yaml says why the
        # frontend is on loopback). Plain TCP, so TLS goes end to end to Temporal.
        - name: frontend-forward
          image: *image
          imagePullPolicy: IfNotPresent
          command: [/bin/socat]
          args:
            - TCP6-LISTEN:7233,ipv6only=1,fork,reuseaddr
            - TCP4:127.0.0.1:7233
          ports:
            - containerPort: 7233
              name: grpc
          livenessProbe:
            tcpSocket:
              port: 7233
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: temporal-config
        - name: authz
          configMap:
            name: temporal-authz
        - name: frontend-tls
          secret:
            secretName: temporal-frontend-tls
            # 0440, root:1000, like the postgres key.
            defaultMode: 0440
        - name: postgres-client
          secret:
            secretName: temporal-postgres-client
            # 0440, root:1000. lib/pq refuses a key readable by anyone else.
            defaultMode: 0440
