# The frontend's only Service, and the only one service-monitor.yaml scrapes.
# Workers reach the frontend at temporal-frontend.temporal.svc:7233. There is no
# off-cluster path: the service CIDR (fd43::/112) is not routed off-cluster.
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: temporal
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
    # Selected by service-monitor.yaml -- the other Services in this namespace
    # carry the managed-by label too and have no metrics port.
    app.kubernetes.io/name: temporal
spec:
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector:
    app: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
