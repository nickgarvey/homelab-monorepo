# spiffe-helper keeps the UI's X.509-SVID in /run/spiffe: svid.pem (leaf, then
# SPIRE's intermediate), svid_key.pem, and bundle.pem (the trust domain's root,
# which also verifies the frontend's certificate). The SVID lives 4h and is
# renewed before it expires; the UI re-reads the files when the key's mtime
# changes, so renewals need no restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-ui-spiffe-helper
  namespace: temporal
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir = "/run/spiffe"
    daemon_mode = true
    svid_file_name = "svid.pem"
    svid_key_file_name = "svid_key.pem"
    svid_bundle_file_name = "bundle.pem"
    health_checks {
      listener_enabled = true
      bind_port = 8081
      liveness_path = "/live"
      readiness_path = "/ready"
    }
