# The frontend's TLS server certificate, from the cluster CA (approved only by
# the cluster-temporal-frontend policy in manifests/cert-manager/cluster-policies.yaml).
# Clients verify it against the root (pki/root.crt), which the Secret's ca.crt also
# carries; the frontend uses that same ca.crt to verify client certificates.
# Temporal re-reads the files every minute (global.tls.refreshInterval), so
# renewals need no restart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: temporal-frontend-tls
  namespace: temporal
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretName: temporal-frontend-tls
  dnsNames:
    - temporal-frontend.temporal.svc
    - temporal-frontend.temporal.svc.cluster.local
  usages:
    - server auth
    - digital signature
    - key encipherment
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-ca
