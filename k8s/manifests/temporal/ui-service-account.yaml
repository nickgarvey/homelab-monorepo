# The UI's own identity, spiffe://home.garvey.sh/ns/temporal/sa/temporal-ui,
# which authz-configmap.yaml grants roles to. Pods sharing a ServiceAccount
# share the identity, so nothing else may use this one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-ui
  namespace: temporal
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
