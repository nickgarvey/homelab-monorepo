# Nightscout's secrets, read from OpenBao (docs/openbao.md, "Pod secrets") and
# mounted as one file per variable at /run/secrets/env. Each workload has its
# own ServiceAccount and reads only its own values.
#
# nightscout (deployment.yaml): MONGODB_URI and API_SECRET, which Nightscout
# reads only from the environment, so env-from-files sets them.
# Values: secrets/openbao/nightscout/nightscout.yaml.
#
# mongo (mongo-statefulset.yaml): the root user (MONGO_INITDB_ROOT_*) and the
# user Nightscout connects as (NIGHTSCOUT_DB_*, created by mongo-init on first
# start). env-from-files sets them for the image's entrypoint, which enables
# --auth on every start because a root user is set. Values:
# secrets/openbao/nightscout/mongo.yaml.
#
# nightscout-backup (backup-cronjob.yaml): MONGODB_URI for the dump and the
# Garage key for the upload, which the containers' scripts export from the
# files. Values: secrets/openbao/nightscout/nightscout-backup.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nightscout
  namespace: nightscout
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: nightscout
  namespace: nightscout
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: nightscout.nightscout
    objects: |
      - objectName: MONGODB_URI
        secretPath: kv/data/k8s/nightscout/nightscout/env
        secretKey: MONGODB_URI
      - objectName: API_SECRET
        secretPath: kv/data/k8s/nightscout/nightscout/env
        secretKey: API_SECRET
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo
  namespace: nightscout
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mongo
  namespace: nightscout
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: nightscout.mongo
    objects: |
      - objectName: MONGO_INITDB_ROOT_USERNAME
        secretPath: kv/data/k8s/nightscout/mongo/credentials
        secretKey: MONGO_INITDB_ROOT_USERNAME
      - objectName: MONGO_INITDB_ROOT_PASSWORD
        secretPath: kv/data/k8s/nightscout/mongo/credentials
        secretKey: MONGO_INITDB_ROOT_PASSWORD
      - objectName: NIGHTSCOUT_DB_USER
        secretPath: kv/data/k8s/nightscout/mongo/credentials
        secretKey: NIGHTSCOUT_DB_USER
      - objectName: NIGHTSCOUT_DB_PASSWORD
        secretPath: kv/data/k8s/nightscout/mongo/credentials
        secretKey: NIGHTSCOUT_DB_PASSWORD
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nightscout-backup
  namespace: nightscout
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: nightscout-backup-dump
  namespace: nightscout
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: nightscout.nightscout-backup
    objects: |
      - objectName: MONGODB_URI
        secretPath: kv/data/k8s/nightscout/nightscout-backup/mongodb
        secretKey: MONGODB_URI
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: nightscout-backup-upload
  namespace: nightscout
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: nightscout.nightscout-backup
    objects: |
      - objectName: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
        secretPath: kv/data/k8s/nightscout/nightscout-backup/s3
        secretKey: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
      - objectName: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
        secretPath: kv/data/k8s/nightscout/nightscout-backup/s3
        secretKey: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
