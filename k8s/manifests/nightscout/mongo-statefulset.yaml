# MongoDB for Nightscout. Pinned to 6.0, the newest major Nightscout's CI tests
# against (4.4, 5.0, 6.0 in cgm-remote-monitor .github/workflows/main.yml as of
# 15.0.8). Reached only through the `mongo` Service by pods in the cluster, and
# every connection must authenticate (the image enables --auth when a root user
# is set).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: nightscout
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  replicas: 1
  serviceName: mongo
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        app.kubernetes.io/managed-by: ngarvey-homelab
    spec:
      serviceAccountName: mongo
      automountServiceAccountToken: false
      # The entrypoint drops to the image's mongodb user, uid/gid 999.
      securityContext:
        fsGroup: 999
      # Time for mongod to flush and exit cleanly on SIGTERM.
      terminationGracePeriodSeconds: 60
      # Copies the static env-from-files binary (packages/env-from-files) into
      # the env-from-files volume for the mongo container's command.
      initContainers:
        - name: env-from-files
          image: oci.garvey.sh/env-from-files:8bfld05lcsks4qkksbnjadzh7d64m83m
          args: ["install", "/opt/env-from-files"]
          volumeMounts:
            - name: env-from-files
              mountPath: /opt/env-from-files
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: mongo
          image: mongo:6.0.28
          # The credentials come from OpenBao as files
          # (secret-provider-class.yaml); env-from-files sets
          # MONGO_INITDB_ROOT_* and NIGHTSCOUT_DB_* from them, then runs the
          # image's entrypoint. The root user being set is what makes the
          # entrypoint start mongod with --auth, on every start.
          command:
            - /opt/env-from-files/env-from-files
            - /run/secrets/env
            - "--"
            - docker-entrypoint.sh
          # The cluster is IPv6-only; --bind_ip_all alone listens on IPv4 only.
          # The cache size is set explicitly so WiredTiger sizes itself to this
          # dataset, not to a fraction of the memory limit.
          args: ["--ipv6", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_DATABASE
              value: nightscout
          volumeMounts:
            - name: credentials
              mountPath: /run/secrets/env
              readOnly: true
            - name: env-from-files
              mountPath: /opt/env-from-files
              readOnly: true
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          # ping needs no authentication.
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mongo
        - name: env-from-files
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
        - name: init
          configMap:
            name: mongo-init
