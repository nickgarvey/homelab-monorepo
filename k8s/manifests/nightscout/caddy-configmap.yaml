apiVersion: v1
kind: ConfigMap
metadata:
  name: nightscout-caddy
  namespace: nightscout
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  Caddyfile: |
    {
      auto_https off
      admin off
    }
    :80 {
      redir https://{host}{uri} permanent
    }
    :443 {
      tls /certs/tls.crt /certs/tls.key
      # Caddy sends X-Forwarded-Proto: https, which satisfies Nightscout's own
      # http->https redirect, so INSECURE_USE_HTTP stays off.
      reverse_proxy http://[::1]:1337
    }
