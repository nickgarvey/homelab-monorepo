apiVersion: v1
kind: Service
metadata:
  name: nightscout
  namespace: nightscout
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
  annotations:
    # Matched by the nightscout AAAA record in modules/networking/dns.nix.
    io.cilium/lb-ipam-ips: "2001:470:482f:2::5012"
spec:
  type: LoadBalancer
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector:
    app: nightscout
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
