# The Anki MCP server's sync login (user:password on anki-sync-server), read
# from OpenBao (docs/openbao.md, "Pod secrets") and mounted by deployment.yaml
# as /run/secrets/anki/credential (ANKI_SYNC_CREDENTIAL_FILE). Values:
# secrets/openbao/mcp-anki/mcp-anki.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-anki
  namespace: mcp-anki
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mcp-anki
  namespace: mcp-anki
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: mcp-anki.mcp-anki
    objects: |
      - objectName: credential
        secretPath: kv/data/k8s/mcp-anki/mcp-anki/sync
        secretKey: credential
