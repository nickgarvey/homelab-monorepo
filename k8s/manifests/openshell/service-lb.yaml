# The gateway's gRPC API on the LAN, so the CLI needs no port-forward. Callers
# authenticate with an Authelia OIDC token (README.md); the TLS certificate is
# from the cluster-ca ClusterIssuer, with this Service's k8s_gateway name
# (gateway.openshell.k8s.home.garvey.sh), set in vendor/openshell/kustomization.yaml.
# The chart's own ClusterIP Service stays as it is: sandboxes reach the gateway
# in-cluster at openshell.openshell.svc:8080.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: openshell
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
  annotations:
    io.cilium/lb-ipam-ips: "2001:470:482f:2::8080"
spec:
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector:
    app.kubernetes.io/instance: openshell
    app.kubernetes.io/name: openshell
  type: LoadBalancer
  ports:
    - name: grpc
      protocol: TCP
      port: 443
      targetPort: grpc
