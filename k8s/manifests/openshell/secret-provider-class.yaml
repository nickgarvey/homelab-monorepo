# The gateway's key-encryption key, read from OpenBao (docs/openbao.md, "Pod
# secrets") and mounted by vendor/openshell/kustomization.yaml at
# /run/secrets/env, which env-from-files turns into
# OPENSHELL_GATEWAY_CREDENTIAL_KEY_ENCRYPTION_KEY (the variable the chart's
# gateway.toml names). Values: secrets/openbao/openshell/openshell.yaml.
#
# key-encryption-key: base64 of 32 random bytes. It encrypts every stored
# provider credential; each one records sha256 of the key it was encrypted
# with, and a different key makes them all unreadable. It exists nowhere else
# than that sops file and OpenBao: do not lose it.
#
# The ServiceAccount is the chart's openshell (the gateway calls the
# Kubernetes API), so the role is openshell.openshell.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: openshell
  namespace: openshell
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: openshell.openshell
    objects: |
      - objectName: OPENSHELL_GATEWAY_CREDENTIAL_KEY_ENCRYPTION_KEY
        secretPath: kv/data/k8s/openshell/openshell/kek
        secretKey: key-encryption-key
