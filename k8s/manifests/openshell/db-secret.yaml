# The gateway's database URL, read through server.externalDbSecret
# (vendor/openshell/values.yaml). There is no password in it: the role logs in
# with the client certificate from postgres-client-certificate.yaml, mounted at
# /etc/openshell-pg by vendor/openshell/kustomization.yaml, so this file is
# plain and not a SopsSecret.
apiVersion: v1
kind: Secret
metadata:
  name: openshell-db
  namespace: openshell
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
type: Opaque
stringData:
  uri: postgres://openshell@postgres-rw.postgres.svc:5432/openshell?sslmode=verify-full&sslrootcert=/etc/openshell-pg/ca.crt&sslcert=/etc/openshell-pg/tls.crt&sslkey=/etc/openshell-pg/tls.key
