# The gateway's login to the shared postgres: the CN is the postgres role, the URI
# SAN its SPIFFE ID (the chart's ServiceAccount is openshell). Issued by the
# cluster CA only because manifests/cert-manager/cluster-policies.yaml allows
# exactly this name here.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openshell-postgres-client
  namespace: openshell
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretName: openshell-postgres-client
  commonName: openshell
  uris:
    - spiffe://home.garvey.sh/ns/openshell/sa/openshell
  usages:
    - client auth
    - digital signature
    - key encipherment
  # Short lived: the gateway's connection pool reopens connections and reads
  # the renewed files from the mounted Secret.
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-ca
