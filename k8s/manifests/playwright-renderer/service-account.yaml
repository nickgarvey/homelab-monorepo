# The renderer's identity: spiffe://home.garvey.sh/ns/playwright-renderer/sa/playwright-renderer,
# the URI in its server certificate (certificate.yaml). It never calls the API server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: playwright-renderer
  namespace: playwright-renderer
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
