# Anyone may reach the LoadBalancer Service in service.yaml on its target ports.
# Allow-only: the deny comes from manifests/cilium/pod-ingress-default-deny.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: playwright-renderer-lb-ingress
  namespace: playwright-renderer
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  description: "LoadBalancer target ports open to all"
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app: playwright-renderer
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
