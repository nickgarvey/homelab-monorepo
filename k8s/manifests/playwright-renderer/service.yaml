# ClusterIP only: the renderer authenticates every client by mutual TLS
# (trmnl-display's X.509-SVID), and nothing outside the cluster calls it.
apiVersion: v1
kind: Service
metadata:
  name: playwright-renderer
  namespace: playwright-renderer
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  selector:
    app: playwright-renderer
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
