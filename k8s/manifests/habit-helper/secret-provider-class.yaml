# PostgREST's JWT key (HS256), read from OpenBao (docs/openbao.md, "Pod
# secrets") and mounted by deployment.yaml as /etc/postgrest/jwt/jwt-secret
# (PGRST_JWT_SECRET). agent-token signs habit-data tokens with the same value
# (secrets/openbao/agents/agent-token.yaml). Values:
# secrets/openbao/habit-helper/postgrest.yaml. The ServiceAccount is service-account.yaml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgrest
  namespace: habit-helper
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: habit-helper.postgrest
    objects: |
      - objectName: jwt-secret
        secretPath: kv/data/k8s/habit-helper/postgrest/jwt
        secretKey: jwt-secret
