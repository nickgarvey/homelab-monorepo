# PostgREST's identity, spiffe://home.garvey.sh/ns/habit-helper/sa/postgrest,
# which both of its postgres client certificates carry as their URI SAN.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgrest
  namespace: habit-helper
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
