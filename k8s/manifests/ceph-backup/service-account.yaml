# The backup worker's identity: spiffe://home.garvey.sh/ns/ceph-backup/sa/ceph-backup-worker
# to SPIRE (Temporal, and the RGW role ceph-backup through STS). Its token is
# mounted: the worker elects the metrics leader with a Lease (rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ceph-backup-worker
  namespace: ceph-backup
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
