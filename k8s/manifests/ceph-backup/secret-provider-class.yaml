# The backup worker's credentials, read from OpenBao (docs/openbao.md, "Pod
# secrets") and mounted by daemonset.yaml, one SecretProviderClass per
# directory the worker reads (README.md, "Credentials"). Values:
# secrets/openbao/ceph-backup/ceph-backup-worker.yaml.
#
# The ServiceAccount is service-account.yaml's ceph-backup-worker (it keeps its
# token for the metrics Lease, rbac.yaml), so the role is
# ceph-backup.ceph-backup-worker.
#
# ceph: keyring, the cephx keyring of client.ceph-backup.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ceph-backup-ceph
  namespace: ceph-backup
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: ceph-backup.ceph-backup-worker
    objects: |
      - objectName: keyring
        secretPath: kv/data/k8s/ceph-backup/ceph-backup-worker/ceph
        secretKey: keyring
---
# rgw-admin: access_key and secret_key of the admin-ops user
# ceph-backup-admin-ops (read caps only).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ceph-backup-rgw-admin
  namespace: ceph-backup
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: ceph-backup.ceph-backup-worker
    objects: |
      - objectName: access_key
        secretPath: kv/data/k8s/ceph-backup/ceph-backup-worker/rgw-admin
        secretKey: access_key
      - objectName: secret_key
        secretPath: kv/data/k8s/ceph-backup/ceph-backup-worker/rgw-admin
        secretKey: secret_key
---
# kopia: the Garage key of bucket ceph-backup (garage_key_id,
# garage_secret_key) and the repository password (kopia_password). Losing the
# password makes the repository unreadable; its recovery copy is
# kopia_password in secrets/ceph-backup.yaml (docs/ceph-backup.md).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ceph-backup-kopia
  namespace: ceph-backup
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: ceph-backup.ceph-backup-worker
    objects: |
      - objectName: garage_key_id
        secretPath: kv/data/k8s/ceph-backup/ceph-backup-worker/kopia
        secretKey: garage_key_id
      - objectName: garage_secret_key
        secretPath: kv/data/k8s/ceph-backup/ceph-backup-worker/kopia
        secretKey: garage_secret_key
      - objectName: kopia_password
        secretPath: kv/data/k8s/ceph-backup/ceph-backup-worker/kopia
        secretKey: kopia_password
---
# storj: access_key and secret_key of Storj's hosted S3 gateway, bucket
# ceph-backup.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ceph-backup-storj
  namespace: ceph-backup
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: ceph-backup.ceph-backup-worker
    objects: |
      - objectName: access_key
        secretPath: kv/data/k8s/ceph-backup/ceph-backup-worker/storj
        secretKey: access_key
      - objectName: secret_key
        secretPath: kv/data/k8s/ceph-backup/ceph-backup-worker/storj
        secretKey: secret_key
