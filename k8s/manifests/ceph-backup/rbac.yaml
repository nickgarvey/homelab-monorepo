# The worker pods elect which of them computes the backup metrics with the
# Lease ceph-backup-metrics. Nothing else in the cluster is theirs to read.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ceph-backup-worker
  namespace: ceph-backup
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
rules:
  # create cannot be limited by name.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["ceph-backup-metrics"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ceph-backup-worker
  namespace: ceph-backup
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ceph-backup-worker
subjects:
  - kind: ServiceAccount
    name: ceph-backup-worker
    namespace: ceph-backup
