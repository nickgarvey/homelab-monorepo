apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: ceph
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  # The Ceph mgr prometheus module on joor/zah/frul
  # (modules/services/ceph.nix). Only the active mgr serves metrics; standbys
  # answer 200 with an empty body, so all three stay "up" and whichever is
  # active supplies the data, with no scrape change on failover.
  staticConfigs:
    - targets:
        - joor.home.garvey.sh:9283
        - zah.home.garvey.sh:9283
        - frul.home.garvey.sh:9283
      labels:
        job: ceph
  # Metrics carry their own ceph_daemon labels; keep them over the target's.
  honorLabels: true
