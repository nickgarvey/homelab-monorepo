# Prometheus's Caddy sidecar's secret, read from OpenBao (docs/openbao.md, "Pod
# secrets") and mounted by prometheus.yaml at /run/secrets/remote-write.
# Values: secrets/openbao/prometheus/prometheus.yaml.
#
# bcrypt: the bcrypt hash of the Vector agents' remote-write password
# (secrets/prometheus-remote-write.yaml, modules/services/vector-agent.nix),
# which caddy-configmap.yaml checks with {file./run/secrets/remote-write/bcrypt}.
#
# The ServiceAccount is rbac.yaml's prometheus (Prometheus calls the Kubernetes
# API for service discovery), so the role is prometheus.prometheus.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: prometheus
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: prometheus.prometheus
    objects: |
      - objectName: bcrypt
        secretPath: kv/data/k8s/prometheus/prometheus/remote-write
        secretKey: bcrypt
---
# Alertmanager's credentials, read from OpenBao and mounted by
# alertmanager.yaml at /etc/alertmanager/secrets/alertmanager-credentials/, the
# paths alertmanager-config.yaml reads them from. Values:
# secrets/openbao/prometheus/alertmanager.yaml.
#
# smtp-password: the Gmail app password for the email receiver.
# cronitor-url: the Cronitor heartbeat URL the Watchdog pings
# (cronitor-heartbeat receiver).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: alertmanager
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: prometheus.alertmanager
    objects: |
      - objectName: smtp-password
        secretPath: kv/data/k8s/prometheus/alertmanager/credentials
        secretKey: smtp-password
      - objectName: cronitor-url
        secretPath: kv/data/k8s/prometheus/alertmanager/credentials
        secretKey: cronitor-url
