# spiffe-helper keeps Prometheus's SVIDs in /run/spiffe. Prometheus uses only
# the JWT-SVID with audience incus.home.garvey.sh (jwt_svid.token), the bearer
# token for Incus's /1.0/metrics (scrape-configs/incus.yaml); Prometheus reads
# the file again on every scrape, so renewals need no reload.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-spiffe-helper
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir = "/run/spiffe"
    daemon_mode = true
    svid_file_name = "svid.pem"
    svid_key_file_name = "svid_key.pem"
    svid_bundle_file_name = "bundle.pem"
    jwt_svids = [{ jwt_audience = "incus.home.garvey.sh", jwt_svid_file_name = "jwt_svid.token" }]
    health_checks {
      listener_enabled = true
      bind_port = 8081
      liveness_path = "/live"
      readiness_path = "/ready"
    }
