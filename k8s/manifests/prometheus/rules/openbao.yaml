apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbao-alerts
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
    prometheus: prometheus
spec:
  groups:
    - name: openbao
      rules:
        # Pushed every 3 minutes by each Raft node (modules/services/openbao.nix):
        # sys/health from its loopback listener, the expiry of the certificate its
        # API listener actually serves, and the time of its last snapshot upload.
        - alert: OpenBaoNodeDown
          expr: openbao_up == 0 or openbao_sealed == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "OpenBao on {{ $labels.hostname }} is down or sealed"
            description: "{{ $labels.hostname }} has not answered sys/health unsealed for 10 minutes. Two of three nodes must be up for any issuance; a second failure now stops it. See docs/openbao.md."

        - alert: OpenBaoNoActiveNode
          expr: sum(openbao_active) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OpenBao has no active node"
            description: "No Raft node reports itself active, so OpenBao cannot issue certificates or serve logins. Raft has probably lost quorum. See docs/openbao.md."

        - alert: OpenBaoMetricsMissing
          expr: count(openbao_up) < 3 or absent(openbao_up)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Fewer than three OpenBao nodes are reporting"
            description: "These metrics are pushed, so a node that stops reporting looks healthy unless its silence is alerted on. Check the vector service on fus, ro and dah."

        # Renewal starts 30 days out; under 21 means it has already failed for a
        # week. Covers a renewal that never reached the listener, too: this is
        # the certificate actually served on 8200.
        - alert: OpenBaoListenerCertExpiring
          expr: (openbao_listener_cert_expiry_timestamp_seconds - time()) < 21 * 86400 and openbao_listener_cert_expiry_timestamp_seconds > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "OpenBao listener certificate on {{ $labels.hostname }} expires in {{ $value | humanizeDuration }}"
            description: "The Let's Encrypt certificate served on {{ $labels.hostname }}:8200 should have renewed by now. Check `systemctl status acme-openbao.home.garvey.sh` there; renewal uses DNS-01 against Knot (docs/tls.md)."

        # Hosts' 7-day certificates from the hosts CA (modules/services/pki-dns-cert.nix)
        # renew with 3 days left; under 2 means a renewal has failed for a day.
        - alert: PkiDnsCertExpiring
          expr: (pki_dns_cert_expiry_timestamp_seconds - time()) < 2 * 86400 and pki_dns_cert_expiry_timestamp_seconds > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Hosts CA certificate on {{ $labels.hostname }} expires in {{ $value | humanizeDuration }}"
            description: "{{ $labels.hostname }}.home.garvey.sh from OpenBao's pki-dns should have renewed by now. Check `systemctl status acme-order-renew-{{ $labels.hostname }}.home.garvey.sh` there; renewal is ACME against OpenBao with DNS-01 in Knot (docs/openbao.md, \"Hosts CA\")."

        - alert: PkiDnsCertMissing
          expr: pki_dns_cert_expiry_timestamp_seconds == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No hosts CA certificate on {{ $labels.hostname }}"
            description: "modules/services/pki-dns-cert.nix finds no readable certificate for {{ $labels.hostname }}.home.garvey.sh. Check the acme-order-renew unit there."

        # Only the active node uploads, so the newest upload across nodes counts.
        - alert: OpenBaoSnapshotStale
          expr: time() - max(openbao_snapshot_last_success_timestamp_seconds) > 36 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No OpenBao snapshot uploaded for over 36 hours"
            description: "The daily openbao-snapshot timer has not uploaded to the openbao-snapshots bucket on Ceph RGW. Check `journalctl -u openbao-snapshot` on the active node. See docs/openbao.md."
