apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-caddy
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  Caddyfile: |
    {
      auto_https off
      admin off
    }
    :80 {
      redir https://{host}{uri} permanent
    }
    :443 {
      tls /certs/tls.crt /certs/tls.key

      # Lifecycle and admin endpoints are not served from outside the pod. The
      # operator's config-reloader calls /-/reload on localhost, not through here.
      @lifecycle path /-/quit* /-/reload* /api/v1/admin*
      handle @lifecycle {
        respond 403
      }

      # Remote write takes the Vector agents' credential
      # (modules/services/vector-agent.nix); the bcrypt hash is in secret.yaml.
      handle /api/v1/write* {
        basic_auth {
          vector {$REMOTE_WRITE_BCRYPT}
        }
        reverse_proxy http://[::1]:9090
      }

      # Everything else (UI, query API) stays anonymous and read-only.
      handle {
        reverse_proxy http://[::1]:9090
      }
    }
