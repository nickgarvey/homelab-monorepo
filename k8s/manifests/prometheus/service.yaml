# In-cluster only (Grafana). The LAN reaches Prometheus through the
# Caddy sidecar, on the LoadBalancer in service-https.yaml.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: prometheus
  ports:
    - name: web
      protocol: TCP
      port: 9090
      targetPort: 9090
