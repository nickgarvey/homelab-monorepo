apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: alertmanager
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  replicas: 1
  version: v0.31.1
  externalUrl: http://alertmanager.prometheus.k8s.home.garvey.sh:9093

  # Routing config (alertmanager-config.yaml); the credentials it reads by file
  # path are mounted at /etc/alertmanager/secrets/alertmanager-credentials/.
  configSecret: alertmanager-config
  secrets:
    - alertmanager-credentials

  # Runs on the k3s servers (fus/ro/dah) so alerting keeps working when the
  # storage nodes and Ceph are down.
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
---
# In-cluster only: Alertmanager has no auth, and silences would mute every alert.
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
    alertmanager: alertmanager
  ports:
    - name: web
      protocol: TCP
      port: 9093
      targetPort: 9093

