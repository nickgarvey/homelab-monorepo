# CouchDB's secrets, read from OpenBao (docs/openbao.md, "Pod secrets") and
# mounted as one file per variable at /run/secrets/env.
#
# couchdb (statefulset.yaml): the admin user. The official image's entrypoint
# reads COUCHDB_USER / COUCHDB_PASSWORD from the environment on each start and
# writes them into a generated local.d/docker.ini admin section, so
# env-from-files sets them from the files. Values: secrets/openbao/couchdb/couchdb.yaml.
#
# couchdb-backup (backup-cronjob.yaml, restic-init-job.yaml): the admin user
# again, for the dump, and the Backblaze B2 key and restic repository settings
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, RESTIC_PASSWORD,
# RESTIC_REPOSITORY), which the jobs' scripts export from the files. Its own
# ServiceAccount keeps the B2 key out of reach of the CouchDB pod.
# Values: secrets/openbao/couchdb/couchdb-backup.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: couchdb
  namespace: couchdb
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: couchdb
  namespace: couchdb
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: couchdb.couchdb
    objects: |
      - objectName: COUCHDB_USER
        secretPath: kv/data/k8s/couchdb/couchdb/admin
        secretKey: COUCHDB_USER
      - objectName: COUCHDB_PASSWORD
        secretPath: kv/data/k8s/couchdb/couchdb/admin
        secretKey: COUCHDB_PASSWORD
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: couchdb-backup
  namespace: couchdb
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: couchdb-backup
  namespace: couchdb
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: couchdb.couchdb-backup
    objects: |
      - objectName: COUCHDB_USER
        secretPath: kv/data/k8s/couchdb/couchdb-backup/admin
        secretKey: COUCHDB_USER
      - objectName: COUCHDB_PASSWORD
        secretPath: kv/data/k8s/couchdb/couchdb-backup/admin
        secretKey: COUCHDB_PASSWORD
      - objectName: AWS_ACCESS_KEY_ID
        secretPath: kv/data/k8s/couchdb/couchdb-backup/b2
        secretKey: AWS_ACCESS_KEY_ID
      - objectName: AWS_SECRET_ACCESS_KEY
        secretPath: kv/data/k8s/couchdb/couchdb-backup/b2
        secretKey: AWS_SECRET_ACCESS_KEY
      - objectName: RESTIC_PASSWORD
        secretPath: kv/data/k8s/couchdb/couchdb-backup/b2
        secretKey: RESTIC_PASSWORD
      - objectName: RESTIC_REPOSITORY
        secretPath: kv/data/k8s/couchdb/couchdb-backup/b2
        secretKey: RESTIC_REPOSITORY
