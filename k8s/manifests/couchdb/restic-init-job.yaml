# Creates the restic repository in B2 if it does not exist yet. It sits with
# the rest of the couchdb manifests, so `kubectl apply -f manifests/couchdb/`
# runs it again: against an existing repository it only checks that the
# repository opens, and the finished Job deletes itself a day later.
apiVersion: batch/v1
kind: Job
metadata:
  name: couchdb-restic-init
  namespace: couchdb
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: couchdb-restic-init
        app.kubernetes.io/managed-by: ngarvey-homelab
    spec:
      serviceAccountName: couchdb-backup
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: init
          image: alpine:3.24
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # couchdb-backup's secrets (the B2 key and restic settings among
              # them), one file per variable (secret-provider-class.yaml).
              for f in /run/secrets/env/*; do
                export "${f##*/}=$(cat "$f")"
              done
              apk add --no-cache restic >/dev/null
              # `restic cat config` fails both when there is no repository and when
              # it cannot be opened (wrong password, B2 unreachable), and init
              # refuses to touch an existing one, so a broken connection still
              # fails the Job instead of being mistaken for a missing repository.
              if restic cat config >/dev/null 2>&1; then
                echo "repository already initialized"
              else
                restic init
              fi
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/env
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: couchdb-backup
