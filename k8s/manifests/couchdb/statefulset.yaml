apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: couchdb
  namespace: couchdb
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  replicas: 1
  serviceName: couchdb-headless
  selector:
    matchLabels:
      app: couchdb
  template:
    metadata:
      labels:
        app: couchdb
        app.kubernetes.io/managed-by: ngarvey-homelab
    spec:
      serviceAccountName: couchdb
      automountServiceAccountToken: false
      # Copies the static env-from-files binary (packages/env-from-files) into
      # the env-from-files volume for the couchdb container's command.
      initContainers:
        - name: env-from-files
          image: oci.garvey.sh/env-from-files:8bfld05lcsks4qkksbnjadzh7d64m83m
          args: ["install", "/opt/env-from-files"]
          volumeMounts:
            - name: env-from-files
              mountPath: /opt/env-from-files
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      # The official couchdb image runs as uid/gid 5984.
      securityContext:
        fsGroup: 5984
        runAsUser: 5984
        runAsGroup: 5984
      containers:
        # TLS terminator for obsidian-livesync.home.garvey.sh, following the anki/jellyfin sidecar
        # pattern (manifests/cert-manager/ONBOARDING.md). Caddy loads the cert only
        # at startup, so a `kubectl rollout restart` is needed after each
        # ~60-day cert-manager renewal, same as anki, zot and jellyfin.
        - name: caddy
          image: caddy:2-alpine
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
          ports:
            - containerPort: 80
              name: http-redirect
            - containerPort: 443
              name: https
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
            - name: caddy-data
              mountPath: /data
            - name: certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: couchdb
          image: couchdb:3.4
          # The admin user comes from OpenBao as files
          # (secret-provider-class.yaml); env-from-files sets COUCHDB_USER and
          # COUCHDB_PASSWORD from them, then runs the image's entrypoint and
          # command.
          command:
            - /opt/env-from-files/env-from-files
            - /run/secrets/env
            - "--"
            - tini
            - "--"
            - /docker-entrypoint.sh
            - /opt/couchdb/bin/couchdb
          ports:
            - containerPort: 5984
              name: http
          volumeMounts:
            - name: admin
              mountPath: /run/secrets/env
              readOnly: true
            - name: env-from-files
              mountPath: /opt/env-from-files
              readOnly: true
            - name: data
              mountPath: /opt/couchdb/data
            - name: config
              mountPath: /opt/couchdb/etc/local.d/10-livesync.ini
              subPath: 10-livesync.ini
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /_up
              port: 5984
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_up
              port: 5984
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: admin
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: couchdb
        - name: env-from-files
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: caddy-config
          configMap:
            name: couchdb-caddy
        - name: caddy-data
          emptyDir: {}
        - name: certs
          secret:
            secretName: couchdb-tls
        - name: data
          persistentVolumeClaim:
            claimName: couchdb-data
        - name: config
          configMap:
            name: couchdb-config
