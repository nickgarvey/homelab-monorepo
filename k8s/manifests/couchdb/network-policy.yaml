# Anyone may reach the LoadBalancer Service in service-https.yaml on its target ports.
# Allow-only: the deny comes from manifests/cilium/pod-ingress-default-deny.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: couchdb-lb-ingress
  namespace: couchdb
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  description: "LoadBalancer target ports open to all"
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app: couchdb
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
