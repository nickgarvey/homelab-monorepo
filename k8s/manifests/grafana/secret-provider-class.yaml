# Grafana's secrets, read from OpenBao (docs/openbao.md, "Pod secrets") and
# mounted by deployment.yaml at /run/secrets/grafana, one file per key, which
# Grafana reads through its GF_<SECTION>_<KEY>__FILE variables.
# admin-password: the break-glass local admin. Grafana reads
# GF_SECURITY_ADMIN_PASSWORD only when it creates a fresh database; on the
# existing one, rotate with
# `grafana cli admin reset-admin-password --password-from-stdin`.
# oauth-client-secret: plaintext of the grafana OIDC client secret whose pbkdf2
# digest is in manifests/authelia/configmap.yaml.
# Values: secrets/openbao/grafana/grafana.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: grafana.grafana
    objects: |
      - objectName: admin-password
        secretPath: kv/data/k8s/grafana/grafana/auth
        secretKey: admin-password
      - objectName: oauth-client-secret
        secretPath: kv/data/k8s/grafana/grafana/auth
        secretKey: oauth-client-secret
