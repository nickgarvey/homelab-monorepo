apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: grafana
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretName: grafana-tls
  dnsNames:
    - grafana.home.garvey.sh
  issuerRef:
    name: letsencrypt-rfc2136-prod
    kind: ClusterIssuer
