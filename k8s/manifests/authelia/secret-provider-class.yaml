# Authelia's secrets, read from OpenBao (docs/openbao.md, "Pod secrets") and
# mounted at /secrets in the authelia container (deployment.yaml). Values:
# secrets/openbao/authelia/authelia.yaml. They are read at mount time: after changing one, push
# it and restart the pod.
# users_database.yml: the file authentication backend. Users log in with a
# passkey; each password hash is for a random password nobody knows. To let a
# user register a passkey on a new device, put a temporary known hash there
# (`authelia crypto hash generate argon2`), push, restart, log in once,
# register, then put a random one back.
# oidc-jwks.pem: RS256 key that signs OIDC ID tokens (authelia crypto pair rsa generate).
# jwt-secret, session-secret, storage-encryption-key, oidc-hmac-secret: the
# *_FILE variables in deployment.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authelia
  namespace: authelia
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: authelia
  namespace: authelia
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: authelia.authelia
    objects: |
      - objectName: jwt-secret
        secretPath: kv/data/k8s/authelia/authelia/secrets
        secretKey: jwt-secret
      - objectName: session-secret
        secretPath: kv/data/k8s/authelia/authelia/secrets
        secretKey: session-secret
      - objectName: storage-encryption-key
        secretPath: kv/data/k8s/authelia/authelia/secrets
        secretKey: storage-encryption-key
      - objectName: oidc-hmac-secret
        secretPath: kv/data/k8s/authelia/authelia/secrets
        secretKey: oidc-hmac-secret
      - objectName: oidc-jwks.pem
        secretPath: kv/data/k8s/authelia/authelia/secrets
        secretKey: oidc-jwks.pem
      - objectName: users_database.yml
        secretPath: kv/data/k8s/authelia/authelia/secrets
        secretKey: users_database.yml
