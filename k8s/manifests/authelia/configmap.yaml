apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  # Secrets come from the authelia-secrets Secret: the *_FILE env vars in
  # deployment.yaml, plus the JWKS key through the template filter below.
  configuration.yml: |
    theme: auto
    server:
      # Only the Caddy sidecar reaches this (TLS on the LB address).
      address: 'tcp://[::1]:9091/'
    log:
      level: info
    authentication_backend:
      # users_database.yml is mounted read-only from the Secret; add or change
      # users there (sops) and restart the pod.
      password_reset:
        disable: true
      password_change:
        disable: true
      file:
        path: /secrets/users_database.yml
        watch: false
    # Log in with a passkey instead of a password. The user's password hash in
    # users_database.yml is for a random password nobody knows; registering a
    # passkey on a new device needs a temporary known hash (sops) for one login.
    webauthn:
      enable_passkey_login: true
      # A passkey that verified the user (PIN or biometric) counts as both
      # factors, so passkey login alone satisfies two_factor clients.
      experimental_enable_passkey_uv_two_factors: true
      selection_criteria:
        discoverability: required
        user_verification: required
    access_control:
      # Applies only to forward-auth requests, and nothing uses forward-auth yet:
      # OIDC clients set their own authorization_policy. Authelia rejects 'deny'
      # without rules; when adding forward-auth rules here, switch this to deny.
      default_policy: one_factor
    session:
      cookies:
        - domain: home.garvey.sh
          authelia_url: https://auth.home.garvey.sh
    storage:
      local:
        path: /config/db.sqlite3
    # No SMTP: one-time codes (e.g. registering a passkey or TOTP) land in this
    # file; read it with kubectl exec.
    notifier:
      filesystem:
        filename: /config/notification.txt
    identity_providers:
      oidc:
        jwks:
          - key_id: main
            algorithm: RS256
            use: sig
            key: {{ secret "/secrets/oidc-jwks.pem" | mindent 10 "|" | msquote }}
        # Authelia 4.39 keeps ID tokens minimal; Grafana reads the role
        # (role_attribute_path over groups) from the ID token first.
        claims_policies:
          grafana:
            id_token:
              - groups
              - email
              - email_verified
              - preferred_username
              - name
          # The OpenShell gateway reads roles from the access token (JWT).
          openshell-cli:
            access_token:
              - groups
          # The Temporal frontend maps groups named temporal-<namespace>-<role>
          # to Temporal roles, from the access token the UI forwards; the UI
          # shows the user's name from the ID token.
          temporal-ui:
            access_token:
              - groups
            id_token:
              - email
              - name
              - preferred_username
        # The Temporal UI sends any 403 from Temporal back to its login, so a
        # user with no temporal-* group would bounce between the UI and here.
        # Refusing them at login shows Authelia's error page instead. Subjects
        # are exact names, so a new Temporal namespace adds its groups here
        # (temporal-<namespace>-<role>, manifests/temporal/README.md).
        authorization_policies:
          temporal:
            default_policy: deny
            rules:
              - policy: two_factor
                subject:
                  - group:temporal-system-read
                  - group:temporal-system-write
                  - group:temporal-system-admin
                  - group:temporal-default-read
                  - group:temporal-default-write
                  - group:temporal-default-admin
        lifespans:
          custom:
            # Refresh tokens slide: each refresh issues a new one valid this long
            # from then, so the openshell CLI only needs a browser login after
            # this much idle time.
            openshell-cli:
              refresh_token: 30d
        clients:
          - client_id: grafana
            client_name: Grafana
            claims_policy: grafana
            # pbkdf2 digest of the plaintext in manifests/grafana/secret.yaml.
            client_secret: '$pbkdf2-sha512$310000$8kW131B4Xs.aZCwJtHBalw$aquf9/yGNeM0fgryX9kJJDX9LtmixS9QeET9dEVVBgOAris21DFtE.DZ/x0AfHPP977/X5dXVFL6gmxt8V9xZw'
            public: false
            authorization_policy: two_factor
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://grafana.home.garvey.sh/login/generic_oauth
            scopes:
              - openid
              - profile
              - email
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
            access_token_signed_response_alg: none
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_basic
          # The openshell CLI against the OpenShell gateway (manifests/openshell).
          # A native app: Authorization Code + PKCE on a loopback redirect, where
          # the port is chosen per login and Authelia ignores it when matching.
          - client_id: openshell-cli
            client_name: OpenShell CLI
            claims_policy: openshell-cli
            public: true
            authorization_policy: two_factor
            lifespan: openshell-cli
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - http://127.0.0.1/callback
            # The gateway checks aud against server.oidc.audience; the CLI asks
            # for this audience.
            audience:
              - openshell-cli
            scopes:
              - openid
              - offline_access
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
              - refresh_token
            # The gateway validates access tokens as JWTs against the JWKS.
            access_token_signed_response_alg: RS256
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: none
          # The Temporal UI (manifests/temporal). It forwards the user's access
          # token to the Temporal frontend, which validates it against this JWKS
          # and checks aud = temporal; implicit audience mode grants that audience
          # without the UI asking for it (it cannot).
          - client_id: temporal-ui
            client_name: Temporal
            claims_policy: temporal-ui
            # pbkdf2 digest of the plaintext in manifests/temporal/ui-oidc-secret.yaml.
            client_secret: '$pbkdf2-sha512$310000$SmCKEiCr/fjPZyyq3j2ZjA$7WyifDwJMfOXMH5XnuPzAcjJUcwExZ9xeBjmdeyExnjY09Iv.sNhhViDsZ.Ym6OaF4cl7U/Q2YpBd5VZnLADnQ'
            public: false
            authorization_policy: temporal
            redirect_uris:
              - https://temporal.garvey.sh/auth/sso/callback
            audience:
              - temporal
            requested_audience_mode: implicit
            scopes:
              - openid
              - profile
              - email
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
            access_token_signed_response_alg: RS256
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_basic
