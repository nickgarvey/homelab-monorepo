apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  # Secrets come from OpenBao (secret-provider-class.yaml), mounted at
  # /secrets: the *_FILE env vars in deployment.yaml, plus the JWKS key
  # through the template filter below.
  configuration.yml: |
    theme: auto
    server:
      # Only the Caddy sidecar reaches this (TLS on the LB address).
      address: 'tcp://[::1]:9091/'
    log:
      level: info
    authentication_backend:
      # users_database.yml is mounted read-only from OpenBao; add or change
      # users in secrets/openbao/authelia/authelia.yaml (sops), push it and restart the pod.
      password_reset:
        disable: true
      password_change:
        disable: true
      file:
        path: /secrets/users_database.yml
        watch: false
    # Log in with a passkey instead of a password. The user's password hash in
    # users_database.yml is for a random password nobody knows; registering a
    # passkey on a new device needs a temporary known hash (sops) for one login.
    webauthn:
      enable_passkey_login: true
      # A passkey that verified the user (PIN or biometric) counts as both
      # factors, so passkey login alone satisfies two_factor clients.
      experimental_enable_passkey_uv_two_factors: true
      selection_criteria:
        discoverability: required
        user_verification: required
    access_control:
      # Applies only to forward-auth requests; OIDC clients set their own
      # authorization_policy. A forward-auth domain without a rule is denied.
      default_policy: deny
      rules:
        # Mainsail/Moonraker on skyforge (hosts/skyforge/web-gate.nix). OrcaSlicer
        # uses an API key that nginx checks and never reaches Authelia.
        - domain: skyforge.home.garvey.sh
          policy: two_factor
        # Frigate on lydia (modules/containers/frigate.nix). Frigate maps the
        # `admins` group to its admin role, everyone else to viewer.
        - domain: frigate.home.garvey.sh
          policy: two_factor
        # Static pages from the RGW bucket `pages` (k8s/manifests/pages),
        # reachable from the internet. Only ngarvey; everyone else is denied.
        - domain: pages.home.garvey.sh
          subject: 'user:ngarvey'
          policy: two_factor
    # The portal is reachable from the internet (k8s/manifests/ipv4-gateway).
    # Bans are per client address, not per user: logins are passkey-only, so
    # failed attempts are noise, and a per-user ban would let anyone lock
    # ngarvey out. The Caddy sidecar sets X-Forwarded-For to the real client
    # (HAProxy passes TCP through and the Service keeps the source address).
    regulation:
      modes:
        - 'ip'
      max_retries: 5
      find_time: '10m'
      ban_time: '1h'
    session:
      cookies:
        - domain: home.garvey.sh
          authelia_url: https://auth.home.garvey.sh
    storage:
      local:
        path: /config/db.sqlite3
    # No SMTP: one-time codes (e.g. registering a passkey or TOTP) land in this
    # file; read it with kubectl exec.
    notifier:
      filesystem:
        filename: /config/notification.txt
    identity_providers:
      oidc:
        jwks:
          - key_id: main
            algorithm: RS256
            use: sig
            key: {{ secret "/secrets/oidc-jwks.pem" | mindent 10 "|" | msquote }}
        claims_policies:
          # MAS (manifests/matrix) reads the Matrix localpart, name and email
          # from the ID token.
          matrix:
            id_token:
              - preferred_username
              - name
              - email
          # The OpenShell gateway reads roles from the access token (JWT).
          openshell-cli:
            access_token:
              - groups
          # The Temporal frontend maps groups named temporal-<namespace>-<role>
          # to Temporal roles, from the access token the UI forwards; the UI
          # shows the user's name from the ID token.
          temporal-ui:
            access_token:
              - groups
            id_token:
              - email
              - name
              - preferred_username
        # The Temporal UI sends any 403 from Temporal back to its login, so a
        # user with no temporal-* group would bounce between the UI and here.
        # Refusing them at login shows Authelia's error page instead. Subjects
        # are exact names, so a new Temporal namespace adds its groups here
        # (temporal-<namespace>-<role>, manifests/temporal/README.md).
        authorization_policies:
          temporal:
            default_policy: deny
            rules:
              - policy: two_factor
                subject:
                  - group:temporal-system-read
                  - group:temporal-system-write
                  - group:temporal-system-admin
                  - group:temporal-default-read
                  - group:temporal-default-write
                  - group:temporal-default-admin
          # Matrix: only ngarvey has an account there.
          matrix:
            default_policy: deny
            rules:
              - policy: two_factor
                subject:
                  - user:ngarvey
          # The MCP connectors (manifests/mcp): only ngarvey.
          mcp:
            default_policy: deny
            rules:
              - policy: two_factor
                subject:
                  - user:ngarvey
          # Jellyfin (manifests/jellyfin): give a user the jellyfin-users group
          # to let them in. The SSO plugin checks the same groups.
          jellyfin:
            default_policy: deny
            rules:
              - policy: two_factor
                subject:
                  - group:jellyfin-users
                  - group:admins
        lifespans:
          custom:
            # Refresh tokens slide: each refresh issues a new one valid this long
            # from then, so the openshell CLI only needs a browser login after
            # this much idle time.
            openshell-cli:
              refresh_token: 30d
            # A connector idle this long must sign in again.
            mcp:
              refresh_token: 90d
        clients:
          # The openshell CLI against the OpenShell gateway (manifests/openshell).
          # A native app: Authorization Code + PKCE on a loopback redirect, where
          # the port is chosen per login and Authelia ignores it when matching.
          - client_id: openshell-cli
            client_name: OpenShell CLI
            claims_policy: openshell-cli
            public: true
            authorization_policy: two_factor
            lifespan: openshell-cli
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - http://127.0.0.1/callback
            # The gateway checks aud against server.oidc.audience; the CLI asks
            # for this audience.
            audience:
              - openshell-cli
            scopes:
              - openid
              - offline_access
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
              - refresh_token
            # The gateway validates access tokens as JWTs against the JWKS.
            access_token_signed_response_alg: RS256
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: none
          # The Temporal UI (manifests/temporal). It forwards the user's access
          # token to the Temporal frontend, which validates it against this JWKS
          # and checks aud = temporal; implicit audience mode grants that audience
          # without the UI asking for it (it cannot).
          - client_id: temporal-ui
            client_name: Temporal
            claims_policy: temporal-ui
            # pbkdf2 digest of the plaintext client-secret in
            # secrets/openbao/temporal/temporal-ui.yaml.
            client_secret: '$pbkdf2-sha512$310000$SmCKEiCr/fjPZyyq3j2ZjA$7WyifDwJMfOXMH5XnuPzAcjJUcwExZ9xeBjmdeyExnjY09Iv.sNhhViDsZ.Ym6OaF4cl7U/Q2YpBd5VZnLADnQ'
            public: false
            authorization_policy: temporal
            redirect_uris:
              - https://temporal.garvey.sh/auth/sso/callback
            audience:
              - temporal
            requested_audience_mode: implicit
            scopes:
              - openid
              - profile
              - email
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
            access_token_signed_response_alg: RS256
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_basic
          # The MCP connectors in claude.ai, one client per module behind
          # the mcp gateway (manifests/mcp). Claude is a public client (PKCE, no
          # secret); the gateway checks the JWT's aud against the module URL,
          # which implicit audience mode grants without Claude asking for it.
          - client_id: claude-notes
            client_name: Claude notes
            public: true
            authorization_policy: mcp
            lifespan: mcp
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://claude.ai/api/mcp/auth_callback
            audience:
              - https://mcp.home.garvey.sh/notes/mcp
            requested_audience_mode: implicit
            scopes:
              - openid
              - offline_access
            response_types:
              - code
            grant_types:
              - authorization_code
              - refresh_token
            access_token_signed_response_alg: RS256
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: none
          - client_id: claude-anki
            client_name: Claude Anki
            public: true
            authorization_policy: mcp
            lifespan: mcp
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://claude.ai/api/mcp/auth_callback
            audience:
              - https://mcp.home.garvey.sh/anki/mcp
            requested_audience_mode: implicit
            scopes:
              - openid
              - offline_access
            response_types:
              - code
            grant_types:
              - authorization_code
              - refresh_token
            access_token_signed_response_alg: RS256
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: none
          - client_id: claude-pages
            client_name: Claude pages
            public: true
            authorization_policy: mcp
            lifespan: mcp
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://claude.ai/api/mcp/auth_callback
            audience:
              - https://mcp.home.garvey.sh/pages/mcp
            requested_audience_mode: implicit
            scopes:
              - openid
              - offline_access
            response_types:
              - code
            grant_types:
              - authorization_code
              - refresh_token
            access_token_signed_response_alg: RS256
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: none
          - client_id: claude-diabetes
            client_name: Claude diabetes
            public: true
            authorization_policy: mcp
            lifespan: mcp
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://claude.ai/api/mcp/auth_callback
            audience:
              - https://mcp.home.garvey.sh/diabetes/mcp
            requested_audience_mode: implicit
            scopes:
              - openid
              - offline_access
            response_types:
              - code
            grant_types:
              - authorization_code
              - refresh_token
            access_token_signed_response_alg: RS256
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: none
          # The Matrix Authentication Service (manifests/matrix), which every
          # Matrix login goes through. The callback ends in the ID of its
          # upstream provider (manifests/matrix/mas-configmap.yaml).
          - client_id: matrix
            client_name: Matrix
            claims_policy: matrix
            # pbkdf2 digest of the plaintext in secrets/openbao/matrix/mas.yaml.
            client_secret: '$pbkdf2-sha512$310000$Bxj00wnzWtURaAyUsnp01Q$cYhinB6pPiIzWSc8a8D65cUheb886Ll3vyOp.A9aLEfKTIvwW0ycKsvkhBy4q1tnSCV6631OLvIRH4kSOYEN1w'
            public: false
            authorization_policy: matrix
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://matrix-auth.home.garvey.sh/upstream/callback/01M4WBV9TZT3FMTQ60T0P7NRDK
            scopes:
              - openid
              - profile
              - email
            response_types:
              - code
            grant_types:
              - authorization_code
            access_token_signed_response_alg: none
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_basic
          # The SSO plugin in Jellyfin (manifests/jellyfin/README.md). It reads
          # the username and groups from the userinfo endpoint.
          - client_id: jellyfin
            client_name: Jellyfin
            # pbkdf2 digest of the plaintext in secrets/manual/jellyfin/sso.yaml.
            client_secret: '$pbkdf2-sha512$310000$CdeUXMqwbRIe3kkNu7v7AQ$UfoDP4UxFDODnLNHGjREHopZhg0l9TjQXnNWgU2pK69SNOPiHH28jBQzwiuGiyxavyWfZBrRptC.suRyWTaMoQ'
            public: false
            authorization_policy: jellyfin
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://jellyfin.garvey.sh/sso/OID/redirect/authelia
            scopes:
              - openid
              - profile
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
            access_token_signed_response_alg: none
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_basic
