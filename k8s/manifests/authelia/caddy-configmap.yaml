apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-caddy
  namespace: authelia
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  Caddyfile: |
    {
      auto_https off
      admin off
    }
    :80 {
      redir https://{host}{uri} permanent
    }
    :443 {
      tls /certs/tls.crt /certs/tls.key
      # Authelia listens on [::1] only; this sidecar is its only way in.
      reverse_proxy http://[::1]:9091
    }
