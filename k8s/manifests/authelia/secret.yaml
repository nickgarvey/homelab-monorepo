# Mounted at /secrets in the authelia container (deployment.yaml).
# users_database.yml: the file authentication backend. Users log in with a
# passkey; each password hash is for a random password nobody knows. To let a
# user register a passkey on a new device, put a temporary known hash there
# (`authelia crypto hash generate argon2`), restart, log in once, register,
# then put a random one back.
# oidc-jwks.pem: RS256 key that signs OIDC ID tokens (authelia crypto pair rsa generate).
