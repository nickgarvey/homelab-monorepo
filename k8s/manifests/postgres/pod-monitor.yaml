apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  # Written here because the Cluster's enablePodMonitor is deprecated.
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
