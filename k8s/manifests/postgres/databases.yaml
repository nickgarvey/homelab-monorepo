# Temporal needs two databases, both owned by the temporal role.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: temporal
  owner: temporal
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal-visibility
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: temporal_visibility
  owner: temporal
  cluster:
    name: postgres
---
# The OpenShell gateway's state (sandboxes, providers, profiles).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: openshell
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: openshell
  owner: openshell
  cluster:
    name: postgres
---
# The celler Nix binary cache (k8s/manifests/celler).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: celler
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: celler
  owner: celler
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: agents
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: agents
  owner: agents
  cluster:
    name: postgres
---
# litellm's virtual keys and spend logs (manifests/litellm).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: litellm
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: litellm
  owner: litellm
  cluster:
    name: postgres
---
# Habit Helper's data (k8s/manifests/habit-helper). Its schema and grants come
# from the migrations in agents/habit-helper/schema/, run as the owner; the
# first also closes CONNECT to everyone but PostgREST's login.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: habit-helper
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: habit_helper
  owner: habit_helper
  cluster:
    name: postgres
---
# Synapse's state (manifests/matrix). Synapse refuses a database whose
# collation and ctype are not C.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: synapse
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: synapse
  owner: synapse
  encoding: UTF8
  localeCollate: C
  localeCType: C
  cluster:
    name: postgres
---
# The Matrix Authentication Service's state (manifests/matrix): users, their
# Authelia links, sessions and tokens.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mas
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: mas
  owner: mas
  cluster:
    name: postgres
