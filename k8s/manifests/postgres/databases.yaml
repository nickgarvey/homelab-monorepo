# Temporal needs two databases, both owned by the temporal role.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: temporal
  owner: temporal
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal-visibility
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: temporal_visibility
  owner: temporal
  cluster:
    name: postgres
---
# The OpenShell gateway's state (sandboxes, providers, profiles).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: openshell
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: openshell
  owner: openshell
  cluster:
    name: postgres
---
# The celler Nix binary cache (k8s/manifests/celler).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: celler
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: celler
  owner: celler
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: agents
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: agents
  owner: agents
  cluster:
    name: postgres
---
# litellm's virtual keys and spend logs (manifests/litellm).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: litellm
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  name: litellm
  owner: litellm
  cluster:
    name: postgres
