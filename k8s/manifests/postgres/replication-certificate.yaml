# The streaming_replica client certificate, issued by the cluster CA. The cluster
# needs one because it validates client certificates against that CA
# (certificates.clientCASecret) and so cannot sign its own.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-replication
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretName: postgres-replication-spiffe
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  commonName: streaming_replica
  usages:
    - client auth
    - digital signature
    - key encipherment
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-ca
