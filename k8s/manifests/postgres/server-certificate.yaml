# The postgres server certificate, issued by the SPIFFE CA so clients (Temporal)
# verify the server against the same CA they get their own certificate from. The
# operator's own server CA rotates every 90 days and would need re-copying into
# every client namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-server
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretName: postgres-server-spiffe
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  dnsNames:
    - postgres-rw
    - postgres-rw.postgres
    - postgres-rw.postgres.svc
    - postgres-rw.postgres.svc.cluster.local
    - postgres-r
    - postgres-r.postgres
    - postgres-r.postgres.svc
    - postgres-r.postgres.svc.cluster.local
    - postgres-ro
    - postgres-ro.postgres
    - postgres-ro.postgres.svc
    - postgres-ro.postgres.svc.cluster.local
  usages:
    - server auth
    - digital signature
    - key encipherment
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: spiffe-ca
