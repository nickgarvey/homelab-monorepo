apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  # Six fields, seconds first: 03:00 UTC daily, clear of the 10:00 Ceph backup.
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  cluster:
    name: postgres
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
