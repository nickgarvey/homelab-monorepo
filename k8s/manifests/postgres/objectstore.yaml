apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-backups
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  # 14 days of base backups and WAL, matching the Ceph RBD backups.
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://postgres-backups/
    endpointURL: https://garage.home.garvey.sh
    s3Credentials:
      accessKeyId:
        name: postgres-backups-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-backups-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # Garage rejects the CRC checksums newer boto3 adds by default.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
      - name: AWS_DEFAULT_REGION
        value: garage
