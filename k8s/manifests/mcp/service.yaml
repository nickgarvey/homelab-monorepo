apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: mcp
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
  annotations:
    # Matched by the mcp AAAA record in modules/networking/dns.nix. WAN
    # clients arrive through the HAProxy SNI router (manifests/ipv4-gateway).
    io.cilium/lb-ipam-ips: "2001:470:482f:2::5013"
spec:
  type: LoadBalancer
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector:
    app: mcp-gateway
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
