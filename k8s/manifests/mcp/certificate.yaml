apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-gateway-tls
  namespace: mcp
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretName: mcp-gateway-tls
  dnsNames:
    - mcp.home.garvey.sh
  issuerRef:
    name: letsencrypt-rfc2136-prod
    kind: ClusterIssuer
