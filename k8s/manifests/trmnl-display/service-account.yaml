# trmnl-display's identity: spiffe://home.garvey.sh/ns/trmnl-display/sa/trmnl-display
# to SPIRE. Its X.509-SVID is the client certificate playwright-renderer accepts
# (ALLOWED_CLIENTS in manifests/playwright-renderer/deployment.yaml). It never
# calls the API server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trmnl-display
  namespace: trmnl-display
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
