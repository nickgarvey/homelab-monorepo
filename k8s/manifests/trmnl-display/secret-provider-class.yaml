# trmnl-display's config.yaml and sa.json, read from OpenBao (docs/openbao.md,
# "Pod secrets") and mounted by deployment.yaml at /config/config.yaml and
# /config/sa.json. Values: secrets/openbao/trmnl-display/trmnl-display.yaml. The ServiceAccount is
# service-account.yaml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: trmnl-display
  namespace: trmnl-display
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: trmnl-display.trmnl-display
    objects: |
      - objectName: config.yaml
        secretPath: kv/data/k8s/trmnl-display/trmnl-display/config
        secretKey: config.yaml
      - objectName: sa.json
        secretPath: kv/data/k8s/trmnl-display/trmnl-display/config
        secretKey: sa.json
