# obsidian-sync-mcp's CouchDB login, read from OpenBao (docs/openbao.md, "Pod
# secrets"): the review-notes user, a member of the obsidian database whose
# writes the _design/review-notes-readonly validate_doc_update rejects.
# deployment.yaml mounts it as files, and env-from-files turns them into the
# COUCHDB_USER and COUCHDB_PASSWORD variables the server reads.
# Values: secrets/openbao/mcp-notes/obsidian-sync-mcp.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obsidian-sync-mcp
  namespace: mcp-notes
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: obsidian-sync-mcp
  namespace: mcp-notes
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: mcp-notes.obsidian-sync-mcp
    objects: |
      - objectName: COUCHDB_USER
        secretPath: kv/data/k8s/mcp-notes/obsidian-sync-mcp/couchdb
        secretKey: COUCHDB_USER
      - objectName: COUCHDB_PASSWORD
        secretPath: kv/data/k8s/mcp-notes/obsidian-sync-mcp/couchdb
        secretKey: COUCHDB_PASSWORD
