# The pruner lists pods in every namespace and deletes the Failed ones.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: failed-pod-pruner
  namespace: failed-pod-pruner
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: failed-pod-pruner
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: failed-pod-pruner
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: failed-pod-pruner
subjects:
  - kind: ServiceAccount
    name: failed-pod-pruner
    namespace: failed-pod-pruner
