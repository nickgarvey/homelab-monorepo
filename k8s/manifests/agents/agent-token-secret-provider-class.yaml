# agent-token's keys, read from OpenBao (docs/openbao.md, "Pod secrets") and
# mounted by agent-token-deployment.yaml. Values:
# secrets/openbao/agents/agent-token.yaml. The files are read at mount time, so a
# changed value reaches the pod only on a restart.
# agent-token-credentials, at /etc/agent-token/credentials: the static
# credentials of agent-token-configmap.yaml's grants, the litellm virtual keys
# (litellm-pi, litellm-habit-helper, litellm-habit-admin: the same values as
# pi, habit-helper and habit-admin in
# secrets/openbao/litellm/litellm-register-keys.yaml) and two throwaway test values
# no grant uses (test-static-token, test-jwt-key).
# agent-token-habit-data, at /etc/agent-token/habit-data: postgrest-jwt-key, the
# habit-data grants' HS256 key. PostgREST checks the tokens with the same value,
# secrets/openbao/habit-helper/postgrest.yaml; change both together.
# agent-token-admin-api, at /etc/agent-token/admin-api: jwt-key, the HS256 key of
# the bridge's admin API tokens (the habit-admin-api grant). The bridge checks
# them with the same value, secrets/openbao/agents/agents-matrix.yaml; change both
# together.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agent-token-credentials
  namespace: agents
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: agents.agent-token
    objects: |
      - objectName: litellm-pi
        secretPath: kv/data/k8s/agents/agent-token/litellm
        secretKey: litellm-pi
      - objectName: litellm-habit-helper
        secretPath: kv/data/k8s/agents/agent-token/litellm
        secretKey: litellm-habit-helper
      - objectName: litellm-habit-admin
        secretPath: kv/data/k8s/agents/agent-token/litellm-habit-admin
        secretKey: litellm-habit-admin
      - objectName: test-static-token
        secretPath: kv/data/k8s/agents/agent-token/credentials
        secretKey: test-static-token
      - objectName: test-jwt-key
        secretPath: kv/data/k8s/agents/agent-token/credentials
        secretKey: test-jwt-key
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agent-token-habit-data
  namespace: agents
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: agents.agent-token
    objects: |
      - objectName: postgrest-jwt-key
        secretPath: kv/data/k8s/agents/agent-token/habit-data
        secretKey: postgrest-jwt-key
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agent-token-admin-api
  namespace: agents
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: agents.agent-token
    objects: |
      - objectName: jwt-key
        secretPath: kv/data/k8s/agents/agent-token/admin-api
        secretKey: jwt-key
