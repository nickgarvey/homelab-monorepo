# The token service's HTTPS certificate, from the cluster CA (approved only by
# the cluster-agent-token policy in manifests/cert-manager/cluster-policies.yaml),
# for its ClusterIP Service. Sandbox supervisors verify it against the
# root (pki/root.crt) baked into our supervisor image (packages/openshell). DNS
# names only: rustls-webpki, which the supervisor verifies with, refuses a
# certificate with a URI SAN under the root's name constraint, so an
# X.509-SVID would not do. agent-token reloads the files when they change,
# so renewals need no restart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: agent-token-tls
  namespace: agents
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretName: agent-token-tls
  dnsNames:
    - agent-token.agents.svc
    - agent-token.agents.svc.cluster.local
  usages:
    - server auth
    - digital signature
    - key encipherment
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-ca
