# The token service's identity: spiffe://home.garvey.sh/ns/agents/sa/agent-token
# to SPIRE. It uses the Workload API only to fetch the trust domain's JWT
# bundle; that ID is also the audience it accepts on JWT-SVIDs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-token
  namespace: agents
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
