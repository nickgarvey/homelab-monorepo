# The Matrix bridge's secrets, read from OpenBao (docs/openbao.md, "Pod
# secrets") and mounted by matrix-deployment.yaml. Values:
# secrets/openbao/agents/agents-matrix.yaml. The files are read at mount time, so a
# changed value reaches the pod only on a restart.
# agents-matrix-registration, at /etc/agents-matrix: registration.yaml, the
# appservice registration with its as_token and hs_token. Synapse holds the
# same file as appservice-agents.yaml (manifests/matrix); change both together.
# agents-matrix-admin-api, at /etc/admin-api: jwt-key, the HS256 key the admin
# API checks tokens with. agent-token signs them with the same value
# (secrets/openbao/agents/agent-token.yaml); change both together.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agents-matrix-registration
  namespace: agents
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: agents.agents-matrix
    objects: |
      - objectName: registration.yaml
        secretPath: kv/data/k8s/agents/agents-matrix/registration
        secretKey: registration.yaml
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agents-matrix-admin-api
  namespace: agents
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: agents.agents-matrix
    objects: |
      - objectName: jwt-key
        secretPath: kv/data/k8s/agents/agents-matrix/admin-api
        secretKey: jwt-key
