# spiffe-helper keeps the worker's SVIDs in /run/spiffe: the X.509-SVID
# (svid.pem, svid_key.pem, and bundle.pem, the trust domain's root, which also
# verifies Temporal's frontend) for Temporal, and a JWT-SVID with audience
# rgw.home.garvey.sh (jwt_svid.token) that the AWS SDK trades for RGW
# credentials through STS. Both are renewed before they expire; the worker
# reads the files again for each handshake and each STS call.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agents-worker-spiffe-helper
  namespace: agents
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir = "/run/spiffe"
    daemon_mode = true
    svid_file_name = "svid.pem"
    svid_key_file_name = "svid_key.pem"
    svid_bundle_file_name = "bundle.pem"
    jwt_svids = [{ jwt_audience = "rgw.home.garvey.sh", jwt_svid_file_name = "jwt_svid.token" }]
    health_checks {
      listener_enabled = true
      bind_port = 8081
      liveness_path = "/live"
      readiness_path = "/ready"
    }
