# The agents worker's login to the shared postgres: the CN is the postgres role,
# the URI SAN its SPIFFE ID. Issued by the cluster CA only because
# manifests/cert-manager/cluster-policies.yaml (cluster-agents-postgres) allows
# exactly this name here.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: agents-postgres-client
  namespace: agents
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretName: agents-postgres-client
  commonName: agents
  uris:
    - spiffe://home.garvey.sh/ns/agents/sa/agents-worker
  usages:
    - client auth
    - digital signature
    - key encipherment
  # Short lived: the worker opens new connections with the renewed files from
  # the mounted Secret.
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-ca
