# anki-sync-server's accounts, read from OpenBao (docs/openbao.md, "Pod
# secrets"). deployment.yaml mounts them as files, and env-from-files turns
# them into the SYNC_USER<n>=user:password variables the server reads.
# SYNC_USER1 is the real collection; SYNC_USER2 (duettest) is a throwaway
# account for testing sync clients against. Values: secrets/openbao/anki/anki-sync-server.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anki-sync-server
  namespace: anki
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: anki-sync-server
  namespace: anki
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: anki.anki-sync-server
    objects: |
      - objectName: SYNC_USER1
        secretPath: kv/data/k8s/anki/anki-sync-server/credentials
        secretKey: SYNC_USER1
      - objectName: SYNC_USER2
        secretPath: kv/data/k8s/anki/anki-sync-server/credentials
        secretKey: SYNC_USER2
