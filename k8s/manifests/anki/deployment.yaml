apiVersion: apps/v1
kind: Deployment
metadata:
  name: anki-sync-server
  namespace: anki
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anki-sync-server
  template:
    metadata:
      labels:
        app: anki-sync-server
        app.kubernetes.io/managed-by: ngarvey-homelab
    spec:
      containers:
        # TLS terminator for anki.home.garvey.sh. anki-sync-server has no
        # cert/key config path of its own, so this follows the jellyfin
        # sidecar pattern from manifests/cert-manager/ONBOARDING.md.
        #
        # Caddy's static `tls` directive loads the cert at startup only and
        # does NOT hot-reload on renewal, and no Reloader is installed -- so a
        # `kubectl rollout restart deploy/anki-sync-server -n anki` is needed
        # after each ~60-day cert-manager renewal, same as zot and jellyfin.
        - name: caddy
          image: caddy:2-alpine
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
          ports:
            - containerPort: 80
              name: http-redirect
            - containerPort: 443
              name: https
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
            - name: caddy-data
              mountPath: /data
            - name: certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        # packages/anki-sync-server: nixpkgs' anki-sync-server, the same
        # version as the `anki` library the Anki MCP server syncs with. The
        # image sets SYNC_PORT=8080, SYNC_BASE=/anki_data and runs as
        # 1000:1000, the owner of the existing files on anki-data.
        - name: anki-sync-server
          image: oci.garvey.sh/anki-sync-server:26.09.3-0bm8amr
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SYNC_HOST
              value: "::"
          envFrom:
            # SYNC_USER1 is the real collection; SYNC_USER2 (duettest) is a
            # throwaway account for testing sync clients against.
            - secretRef:
                name: anki-credentials
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /anki_data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anki-data
        - name: caddy-config
          configMap:
            name: anki-caddy
        - name: caddy-data
          emptyDir: {}
        - name: certs
          secret:
            secretName: anki-tls
