apiVersion: apps/v1
kind: Deployment
metadata:
  name: anki-sync-server
  namespace: anki
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anki-sync-server
  template:
    metadata:
      labels:
        app: anki-sync-server
        app.kubernetes.io/managed-by: ngarvey-homelab
    spec:
      serviceAccountName: anki-sync-server
      automountServiceAccountToken: false
      # Copies the static env-from-files binary (packages/env-from-files) into
      # the env-from-files volume, since the server image has no shell.
      initContainers:
        - name: env-from-files
          image: oci.garvey.sh/env-from-files:8bfld05lcsks4qkksbnjadzh7d64m83m
          args: ["install", "/opt/env-from-files"]
          volumeMounts:
            - name: env-from-files
              mountPath: /opt/env-from-files
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        # TLS terminator for anki.home.garvey.sh. anki-sync-server has no
        # cert/key config path of its own, so this follows the jellyfin
        # sidecar pattern from manifests/cert-manager/ONBOARDING.md.
        #
        # Caddy's static `tls` directive loads the cert at startup only and
        # does NOT hot-reload on renewal, and no Reloader is installed -- so a
        # `kubectl rollout restart deploy/anki-sync-server -n anki` is needed
        # after each ~60-day cert-manager renewal, same as zot and jellyfin.
        - name: caddy
          image: caddy:2-alpine
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
          ports:
            - containerPort: 80
              name: http-redirect
            - containerPort: 443
              name: https
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
            - name: caddy-data
              mountPath: /data
            - name: certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        # packages/anki-sync-server: nixpkgs' anki-sync-server, the same
        # version as the `anki` library the Anki MCP server syncs with. The
        # image sets SYNC_PORT=8080, SYNC_BASE=/anki_data and runs as
        # 1000:1000, the owner of the existing files on anki-data.
        - name: anki-sync-server
          image: oci.garvey.sh/anki-sync-server:26.09.3-0bm8amr
          imagePullPolicy: IfNotPresent
          # The accounts come from OpenBao as files (secret-provider-class.yaml);
          # env-from-files sets one variable per file, then runs the server.
          command:
            - /opt/env-from-files/env-from-files
            - /run/secrets/env
            - "--"
            - /bin/anki-sync-server
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SYNC_HOST
              value: "::"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /anki_data
            - name: credentials
              mountPath: /run/secrets/env
              readOnly: true
            - name: env-from-files
              mountPath: /opt/env-from-files
              readOnly: true
      volumes:
        - name: credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: anki-sync-server
        - name: env-from-files
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: data
          persistentVolumeClaim:
            claimName: anki-data
        - name: caddy-config
          configMap:
            name: anki-caddy
        - name: caddy-data
          emptyDir: {}
        - name: certs
          secret:
            secretName: anki-tls
