# The Matrix Authentication Service's identity:
# spiffe://home.garvey.sh/ns/matrix/sa/mas, the URI SAN in its postgres client
# certificate. It never talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mas
  namespace: matrix
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
