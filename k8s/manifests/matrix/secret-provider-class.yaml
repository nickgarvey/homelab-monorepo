# Synapse's secrets, read from OpenBao (docs/openbao.md, "Pod secrets"). Values:
# secrets/openbao/matrix/synapse.yaml. Read at start: after a change, push it and
# restart Synapse.
# synapse, at /etc/synapse/secrets (configmap.yaml, *_path):
# - signing.key: the server's ed25519 signing key (generate_signing_key).
#   Its events and, once federating, its identity to other servers are
#   signed with it; keep it for the life of the server.
# - macaroon_secret_key, form_secret: random, for login tokens and forms.
# - appservice-agents.yaml: the agents' Matrix bridge's appservice
#   registration; the bridge holds the same file
#   (secrets/openbao/agents/agents-matrix.yaml); change both together.
# synapse-mas, at /etc/synapse/mas: synapse-secret, the secret shared with MAS
# (secrets/openbao/matrix/mas.yaml holds the same value; change both together).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: synapse
  namespace: matrix
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: matrix.synapse
    objects: |
      - objectName: signing.key
        secretPath: kv/data/k8s/matrix/synapse/secrets
        secretKey: signing.key
      - objectName: macaroon_secret_key
        secretPath: kv/data/k8s/matrix/synapse/secrets
        secretKey: macaroon_secret_key
      - objectName: form_secret
        secretPath: kv/data/k8s/matrix/synapse/secrets
        secretKey: form_secret
      - objectName: appservice-agents.yaml
        secretPath: kv/data/k8s/matrix/synapse/secrets
        secretKey: appservice-agents.yaml
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: synapse-mas
  namespace: matrix
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: matrix.synapse
    objects: |
      - objectName: synapse-secret
        secretPath: kv/data/k8s/matrix/synapse/mas
        secretKey: synapse-secret
