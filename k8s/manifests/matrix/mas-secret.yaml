apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
    name: mas-sopssecret
    namespace: matrix
    labels:
        app.kubernetes.io/managed-by: ngarvey-homelab
spec:
    secretTemplates:
        # The Matrix Authentication Service's secrets, as files (mas-configmap.yaml):
        # - encryption: 32 random bytes, hex. Encrypts cookies and database fields;
        #   changing it loses that data, so keep it for the life of the service.
        # - rsa.key, ec.key: the keys MAS signs ID tokens with.
        # - synapse-secret: shared with Synapse, which mounts this key too
        #   (configmap.yaml, matrix_authentication_service). It lets MAS act as
        #   Synapse's admin, and Synapse ask MAS about access tokens.
        # - authelia-client-secret: MAS's secret for Authelia's client "matrix";
        #   its pbkdf2 digest is in manifests/authelia/configmap.yaml.
