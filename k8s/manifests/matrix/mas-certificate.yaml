# matrix-auth.home.garvey.sh's public certificate from Let's Encrypt, DNS-01
# through Knot (manifests/cert-manager/ONBOARDING.md). MAS serves it itself on
# 443. It reads the files only at start, so restart it after a renewal
# (README.md).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mas-tls
  namespace: matrix
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretName: mas-tls
  dnsNames:
    - matrix-auth.home.garvey.sh
  issuerRef:
    name: letsencrypt-rfc2136-prod
    kind: ClusterIssuer
