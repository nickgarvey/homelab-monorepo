apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: matrix
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
  annotations:
    # Matched by matrix.garvey.sh in garveyShOverrides, modules/networking/dns.nix.
    io.cilium/lb-ipam-ips: "2001:470:482f:2::5010"
spec:
  type: LoadBalancer
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector:
    app: synapse
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
