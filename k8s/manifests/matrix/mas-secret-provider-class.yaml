# The Matrix Authentication Service's secrets, read from OpenBao
# (docs/openbao.md, "Pod secrets") and mounted at /etc/mas/secrets
# (mas-deployment.yaml, mas-configmap.yaml). Values: secrets/openbao/matrix/mas.yaml.
# Read at start: after a change, push it and restart MAS.
# - encryption: 32 random bytes, hex. Encrypts cookies and database fields;
#   changing it loses that data, so keep it for the life of the service.
# - rsa.key, ec.key: the keys MAS signs ID tokens with.
# - synapse-secret: shared with Synapse, which holds the same value
#   (secrets/openbao/matrix/synapse.yaml, secrets.mas; change both together). It lets
#   MAS act as Synapse's admin, and Synapse ask MAS about access tokens.
# - authelia-client-secret: MAS's secret for Authelia's client "matrix";
#   its pbkdf2 digest is in manifests/authelia/configmap.yaml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mas
  namespace: matrix
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  provider: openbao
  parameters:
    roleName: matrix.mas
    objects: |
      - objectName: encryption
        secretPath: kv/data/k8s/matrix/mas/secrets
        secretKey: encryption
      - objectName: rsa.key
        secretPath: kv/data/k8s/matrix/mas/secrets
        secretKey: rsa.key
      - objectName: ec.key
        secretPath: kv/data/k8s/matrix/mas/secrets
        secretKey: ec.key
      - objectName: synapse-secret
        secretPath: kv/data/k8s/matrix/mas/secrets
        secretKey: synapse-secret
      - objectName: authelia-client-secret
        secretPath: kv/data/k8s/matrix/mas/secrets
        secretKey: authelia-client-secret
