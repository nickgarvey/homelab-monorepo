# Synapse's login to the shared postgres: the CN is the postgres role, the URI
# SAN its SPIFFE ID. Issued by the SPIFFE CA only because
# manifests/cert-manager/spiffe-policies.yaml allows exactly this name here.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: synapse-postgres-client
  namespace: matrix
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretName: synapse-postgres-client
  commonName: synapse
  uris:
    - spiffe://home.garvey.sh/ns/matrix/sa/synapse
  usages:
    - client auth
    - digital signature
    - key encipherment
  # Short lived: libpq reads the files for every new connection, so Synapse
  # picks up the renewed ones from the mounted Secret without a restart.
  # Connections already open stay up (postgres checks the certificate only at
  # login).
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: spiffe-ca
