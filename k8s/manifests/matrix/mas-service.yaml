apiVersion: v1
kind: Service
metadata:
  name: mas
  namespace: matrix
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
  annotations:
    # matrix-auth in modules/networking/dns.nix.
    io.cilium/lb-ipam-ips: "2001:470:482f:2::5011"
spec:
  type: LoadBalancer
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector:
    app: mas
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
