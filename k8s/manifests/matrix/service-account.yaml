# Synapse's identity: spiffe://home.garvey.sh/ns/matrix/sa/synapse, the URI SAN
# in its postgres client certificate. It never talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: synapse
  namespace: matrix
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
automountServiceAccountToken: false
