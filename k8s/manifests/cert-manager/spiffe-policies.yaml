apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: spiffe-openshell-client
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  # The OpenShell chart's client certificate (Certificate openshell-client),
  # the transport certificate of the CLI and of sandbox supervisors. With
  # mtls_auth the gateway reads it as user openshell-client with no role,
  # which is why no OU is allowed (see spiffe-agents-worker).
  allowed:
    commonName:
      value: openshell-client
      required: true
    usages:
      - client auth
      - digital signature
      - key encipherment
    isCA: false
  constraints:
    privateKey:
      algorithm: ECDSA
      minSize: 256
      maxSize: 521
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: spiffe-ca
    namespace:
      matchNames:
        - openshell
---
