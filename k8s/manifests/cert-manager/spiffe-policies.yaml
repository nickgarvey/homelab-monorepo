        - postgres
---
# cert-manager's ServiceAccount makes the CertificateRequests, so it is the one
# that needs the right to use the policies.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spiffe-policy-use
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
rules:
  - apiGroups: [policy.cert-manager.io]
    resources: [certificaterequestpolicies]
    verbs: [use]
    resourceNames:
      - spiffe-temporal
      - spiffe-temporal-frontend
      - spiffe-postgres-replication
      - spiffe-postgres-server
      - spiffe-openshell
      - spiffe-openshell-gateway
      - spiffe-openshell-client
      - spiffe-celler
      - spiffe-agents-worker
      - spiffe-agents-postgres
      - spiffe-agent-token
      - spiffe-habit-helper-api
      - spiffe-habit-helper-owner
      - spiffe-synapse
      - spiffe-mas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spiffe-policy-use
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spiffe-policy-use
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
