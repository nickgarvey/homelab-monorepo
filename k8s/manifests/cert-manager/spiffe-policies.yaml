apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: spiffe-agents-worker
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  # The agents worker's login to the OpenShell gateway
  # (manifests/agents/openshell-certificate.yaml). The gateway takes a client
  # certificate's CN as the user and its OU values as the user's roles, so the
  # subject must be exactly CN=agents-worker, OU=openshell: openshell is the
  # gateway's user role (server.oidc.userRole in vendor/openshell/values.yaml).
  # No other policy here allows an OU, and none may: any spiffe-ca certificate
  # carrying OU=openshell or OU=admins gets that gateway role. No URI SAN:
  # the gateway's TLS library (rustls-webpki) does not process the root's URI
  # name constraint and refuses any client certificate with a URI under it
  # (NameConstraintViolation).
  allowed:
    commonName:
      value: agents-worker
      required: true
    subject:
      organizationalUnits:
        values: [openshell]
        required: true
    usages:
      - client auth
      - digital signature
      - key encipherment
    isCA: false
  constraints:
    privateKey:
      algorithm: ECDSA
      minSize: 256
      maxSize: 521
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: spiffe-ca
    namespace:
      matchNames:
        - agents
---
