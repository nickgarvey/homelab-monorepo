apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: spiffe-spire-ca
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  # SPIRE's intermediate CA (UpstreamAuthority cert_manager, see
  # manifests/spire/README.md). SPIRE creates the CertificateRequest itself, as
  # its spire-server ServiceAccount, so unlike the policies above this one is
  # usable only by that ServiceAccount (spiffe-spire-ca-use below), never by
  # cert-manager: a Certificate in the spire namespace cannot obtain a CA.
  allowed:
    commonName:
      value: home.garvey.sh SPIRE CA
    subject:
      countries:
        values: [US]
      organizations:
        values: [SPIFFE]
      # SPIRE puts the certificate's serial number here.
      serialNumber:
        value: "*"
    uris:
      values:
        - spiffe://home.garvey.sh
    usages:
      - cert sign
      - crl sign
    isCA: true
  constraints:
    # SPIRE asks for its ca_ttl (24h) and rotates at half-life.
    maxDuration: 24h
    privateKey:
      algorithm: RSA
      minSize: 2048
      maxSize: 4096
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: spiffe-ca
    namespace:
      matchNames:
        - spire
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spiffe-spire-ca-use
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
rules:
  - apiGroups: [policy.cert-manager.io]
    resources: [certificaterequestpolicies]
    verbs: [use]
    resourceNames:
      - spiffe-spire-ca
---
apiVersion: rbac.authorization.k8s.io/v1
