apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
    app.kubernetes.io/name: cert-manager
spec:
  # Kept out of the chart render (vendor/cert-manager/) so the render applies
  # before the prometheus-operator CRDs exist. The selector matches the controller
  # Service the chart creates -- component:controller is what distinguishes it
  # from the webhook/cainjector Services, which expose no useful metrics.
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
  endpoints:
    - port: tcp-prometheus-servicemonitor
      interval: 60s
