# RBD volumes on the external Ceph cluster (joor/zah/frul, ~/nix-configs
# modules/services/ceph.nix): pool `kubernetes`, 3 copies, any node can mount.
# The cluster's only default StorageClass: a PVC that names no class lands
# here, and so is covered by the Ceph backups (nix-configs
# modules/services/ceph-backup.nix).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-rbd
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rbd.csi.ceph.com
parameters:
  clusterID: 8d324da3-f3ab-40f8-aaa1-71ed33705f75
  pool: kubernetes
  # Features the kernel RBD client supports (ceph-csi's documented krbd set).
  imageFeatures: layering,exclusive-lock,object-map,fast-diff,deep-flatten
  csi.storage.k8s.io/fstype: ext4
  csi.storage.k8s.io/provisioner-secret-name: csi-rbd-secret
  csi.storage.k8s.io/provisioner-secret-namespace: ceph-csi-rbd
  csi.storage.k8s.io/controller-expand-secret-name: csi-rbd-secret
  csi.storage.k8s.io/controller-expand-secret-namespace: ceph-csi-rbd
  csi.storage.k8s.io/node-stage-secret-name: csi-rbd-secret
  csi.storage.k8s.io/node-stage-secret-namespace: ceph-csi-rbd
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
