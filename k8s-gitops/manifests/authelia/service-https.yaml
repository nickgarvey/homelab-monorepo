apiVersion: v1
kind: Service
metadata:
  name: authelia-https
  namespace: authelia
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
  annotations:
    # Matched by the auth AAAA record in nix-configs' modules/networking/dns.nix.
    io.cilium/lb-ipam-ips: "2001:470:482f:2::5005"
spec:
  type: LoadBalancer
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector:
    app: authelia
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
