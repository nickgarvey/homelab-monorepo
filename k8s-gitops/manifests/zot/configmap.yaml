apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: zot
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  # Pulls are anonymous (k3s and pods pull without credentials); push and
  # delete need the `ngarvey` account from the zot-auth htpasswd.
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/zot",
        "dedupe": false,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h",
        "storageDriver": {
          "name": "s3",
          "rootdirectory": "/zot",
          "region": "garage",
          "regionendpoint": "http://garage.home.garvey.sh:3900",
          "bucket": "zot",
          "secure": false,
          "forcepathstyle": true
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "443",
        "tls": {
          "cert": "/etc/zot/tls/tls.crt",
          "key": "/etc/zot/tls/tls.key"
        },
        "auth": {
          "htpasswd": {
            "path": "/etc/zot/auth/htpasswd"
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "anonymousPolicy": ["read"],
              "policies": [
                {
                  "users": ["ngarvey"],
                  "actions": ["read", "create", "update", "delete"]
                }
              ],
              "defaultPolicy": ["read"]
            }
          }
        }
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "ui": {
          "enable": true
        },
        "search": {
          "enable": true
        },
        "scrub": {
          "enable": true,
          "interval": "24h"
        }
      }
    }
