apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: disk-usage-alerts
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
    prometheus: prometheus
spec:
  groups:
    - name: disk.usage
      rules:
        # Every block-device mount on every NixOS host, pushed by the vector agent
        # (nix-configs modules/services/vector-agent.nix). btrfs subvolumes report
        # the same filesystem once per mountpoint, so collapse to one series per
        # device.
        - alert: HostDiskOver90Percent
          expr: max by (hostname, device) (host_filesystem_used_ratio) > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.hostname }}: {{ $labels.device }} is {{ $value | humanizePercentage }} full"
            description: "{{ $labels.device }} on {{ $labels.hostname }} has been over 90% used for 15 minutes. Check `df -h` on the host."

        # Kubernetes volumes (Ceph RBD and Longhorn), from kubelet. k3s also serves
        # these through the apiserver endpoint (job="apiserver", namespace relabelled
        # to "default"), so pin the job to avoid double alerts.
        - alert: PVCOver90Percent
          expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{job="kubelet"} / kubelet_volume_stats_capacity_bytes{job="kubelet"}) > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
            description: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has been over 90% used for 15 minutes. Expand it (both storage classes allow volume expansion) or clean up."
